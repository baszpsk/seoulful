<style>
:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface-2: #faf8f5;
  --inset: #efebe4;
  --ink: #171412;
  --ink-2: #4a443e;
  --muted: #847b71;
  --line: #e6e0d6;
  --line-strong: #d3cabd;
  --gold: #a07a3f;
  --gold-soft: #f3ebdd;
  --accent: #171412;
  --accent-ink: #ffffff;
  --ok: #2d6a4d;
  --ok-soft: #e2efe7;
  --warn: #9d6116;
  --warn-soft: #f6ead6;
  --bad: #ad2f28;
  --bad-soft: #f7e2de;
  --rain: #365f8c;
  --rain-soft: #e2ebf5;
  --scrim: rgba(23, 20, 18, 0.42);
  --shadow-1: 0 1px 2px rgba(23, 20, 18, 0.05), 0 1px 1px rgba(23, 20, 18, 0.03);
  --shadow-2: 0 18px 50px rgba(23, 20, 18, 0.18);
  --av-k: #efe3cf; --av-k-ink: #7a5520; --av-f: #e6e3de; --av-f-ink: #3a342e;
  --r-xl: 26px;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  --font: "Anuphan", "Noto Sans Thai", "Sarabun", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --serif: "Playfair Display", "Noto Serif", Georgia, serif;
  --ko: "Noto Serif KR", serif;
  --wrap: 560px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100e; --surface: #1b1815; --surface-2: #1f1c19; --inset: #29251f; --ink: #f2ede6; --ink-2: #cfc6ba; --muted: #9b9185;
    --line: #2e2923; --line-strong: #3e372f; --gold: #d2ac6b; --gold-soft: #2f2618; --accent: #f2ede6; --accent-ink: #171412;
    --ok: #7fc9a0; --ok-soft: #16271e; --warn: #e6b464; --warn-soft: #30230f; --bad: #f08c82; --bad-soft: #361815;
    --rain: #8db7e6; --rain-soft: #16222f; --scrim: rgba(0, 0, 0, 0.6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-2: 0 18px 50px rgba(0, 0, 0, 0.6);
    --av-k: #3a2e1e; --av-k-ink: #e7c996; --av-f: #2e2a25; --av-f-ink: #ddd5ca;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100e; --surface: #1b1815; --surface-2: #1f1c19; --inset: #29251f; --ink: #f2ede6; --ink-2: #cfc6ba; --muted: #9b9185;
  --line: #2e2923; --line-strong: #3e372f; --gold: #d2ac6b; --gold-soft: #2f2618; --accent: #f2ede6; --accent-ink: #171412;
  --ok: #7fc9a0; --ok-soft: #16271e; --warn: #e6b464; --warn-soft: #30230f; --bad: #f08c82; --bad-soft: #361815;
  --rain: #8db7e6; --rain-soft: #16222f; --scrim: rgba(0, 0, 0, 0.6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-2: 0 18px 50px rgba(0, 0, 0, 0.6);
  --av-k: #3a2e1e; --av-k-ink: #e7c996; --av-f: #2e2a25; --av-f-ink: #ddd5ca;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "tnum" 1;
  min-height: 100vh;
}
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; flex: none; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 16px; }
.page { padding-top: 18px; padding-bottom: 120px; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrapx { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.item.stacked { flex-wrap: wrap; }
.item.stacked > .grow { flex-basis: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.mt0 { margin-top: 0 !important; }

/* ---------- brand ---------- */
.brand { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; white-space: nowrap; flex: none; }
.brand .wm { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; }
.brand .ko { font-family: var(--ko); font-weight: 600; font-size: 13px; color: var(--gold); letter-spacing: 0.08em; }
.brand .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); display: inline-block; transform: translateY(-3px); }
/* The fox from the shop's logo, in the app's gold, over the wordmark where there is room. */
.crest { display: block; width: auto; height: 56px; aspect-ratio: 728 / 559; margin: 0 auto 14px; color: var(--gold); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.who { display: flex; align-items: center; gap: 10px; }
.who { min-width: 0; }
.who .meta { text-align: right; line-height: 1.25; min-width: 0; max-width: 46vw; }
.who .meta b, .who .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .meta b { display: block; font-weight: 600; font-size: 14px; }
.who .meta span { font-size: 12px; color: var(--muted); }

.hello { margin: 6px 0 2px; font-size: 28px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; }
.hello small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 4px; letter-spacing: 0; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
h2.title { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
h3.h3 { font-size: 15px; font-weight: 600; margin: 18px 0 8px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 18px; }
.card.pad-lg { padding: 22px; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h .eyebrow { margin: 0; }
.hero { background: var(--ink); color: var(--bg); border: 0; }
.hero .muted, .hero .eyebrow { color: color-mix(in srgb, var(--bg) 62%, transparent); }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

.big { font-size: 44px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; font-weight: 400; letter-spacing: 0; margin-left: 6px; color: var(--muted); }
.hero .big small { color: color-mix(in srgb, var(--bg) 62%, transparent); }
.mid { font-size: 26px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--warn); }
.stat.bad b { color: var(--bad); }

.bar { height: 8px; border-radius: 99px; background: var(--inset); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--gold); transition: width .5s ease; }
.hero .bar { background: rgba(255, 255, 255, 0.14); }

/* ---------- pills, chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--inset); color: var(--ink-2); white-space: nowrap; line-height: 1.5; }
.pill svg { width: 13px; height: 13px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.rain { background: var(--rain-soft); color: var(--rain); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.ink { background: var(--ink); color: var(--bg); }
.pill.dash { background: transparent; box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 10px 14px; text-align: left; min-width: 0; transition: border-color .15s, background .15s, box-shadow .15s; }
.chip b { display: block; font-weight: 600; font-size: 15px; }
.chip > span { display: block; font-size: 12.5px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--ink) inset; }
.chip .tag { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--gold); font-weight: 600; }
.chips.fill .chip { flex: 1 1 0; }
.qty-chips { margin-top: 10px; }
.qty-chips .chip { padding: 7px 12px; font-size: 14px; font-weight: 600; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 15px; white-space: nowrap; text-decoration: none; transition: transform .08s ease, background .15s, opacity .15s; }
.btn:active { transform: scale(0.985); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.block { display: flex; width: 100%; }
.btn.xl { height: 60px; font-size: 17px; border-radius: 18px; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: var(--r-sm); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.loading { pointer-events: none; opacity: 0.75; }
.btn.loading::after { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--inset); }
.icon-btn svg { width: 20px; height: 20px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- avatars, lists ---------- */
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; background: var(--inset); color: var(--ink-2); flex: none; }
.av.kitchen { background: var(--av-k); color: var(--av-k-ink); }
.av.front { background: var(--av-f); color: var(--av-f-ink); }
.av.lg { width: 64px; height: 64px; font-size: 24px; margin: 0 auto; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); background: transparent; width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
.item .t { font-weight: 500; }
.item .s { font-size: 13px; color: var(--muted); }
.item .r { text-align: right; flex: none; }
.item .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.item > svg { color: var(--ink-2); }
.av svg { width: 20px; height: 20px; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- tabs ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar .wrap { display: flex; justify-content: space-around; padding: 0 6px; }
.tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 500; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; font-weight: 600; }
.seg { display: flex; background: var(--inset); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav b { font-weight: 600; font-size: 16px; }
.monthnav .sub { font-size: 12.5px; color: var(--muted); display: block; font-weight: 400; }

/* ---------- start / pin ---------- */
.start { min-height: 100vh; display: flex; flex-direction: column; }
.start-head { padding: 34px 0 10px; text-align: center; }
.start-head .brand .wm { font-size: 34px; }
.start-head .brand .ko { font-size: 15px; }
.start-clock { font-size: 15px; color: var(--muted); margin-top: 6px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.name-tile { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); text-align: left; transition: transform .1s, border-color .15s; }
.name-tile:active { transform: scale(0.98); }
.name-tile:hover { border-color: var(--line-strong); }
.name-tile .grow b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.name-tile .grow span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.group-h { margin: 22px 2px 10px; }
.foot-links { text-align: center; padding: 28px 0 40px; font-size: 13.5px; color: var(--muted); }

.pin-wrap { max-width: 380px; margin: 0 auto; padding: 22px 16px 40px; text-align: center; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 22px 0 26px; min-height: 16px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.pin-dots i.on { background: var(--ink); border-color: var(--ink); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
.pin-typed { font-size: 26px; letter-spacing: 0.3em; min-height: 40px; margin: 18px 0 12px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
.key { height: 66px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); font-size: 26px; font-weight: 400; box-shadow: var(--shadow-1); display: grid; place-items: center; }
.key:active { background: var(--inset); }
.key.fn { background: transparent; box-shadow: none; border-color: transparent; font-size: 15px; color: var(--ink-2); }
.key svg { width: 24px; height: 24px; }
.pin-err { color: var(--bad); font-size: 14px; min-height: 22px; }
.remember { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); margin-top: 16px; }

/* ---------- today / clock ---------- */
.now-clock { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 14px; }
.now-clock span { font-size: 48px; font-weight: 300; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.now-clock small { font-size: 13px; color: var(--muted); }
.live-clock { font-size: 44px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; margin-top: 14px; font-variant-numeric: tabular-nums; }
.scan-ok { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 14.5px; margin: 0 0 10px; }
.scan-ok svg { width: 18px; height: 18px; }
.gps-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.photo-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.photo-wall figure { margin: 0; }
.photo-wall img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; display: block; background: var(--surface-2); }
.photo-wall figcaption { font-size: 12.5px; margin-top: 6px; line-height: 1.35; }
.photo-wall figcaption b { display: block; font-weight: 600; font-size: 13.5px; }
.photo-wall figure.review img { outline: 3px solid var(--warn); outline-offset: -3px; }
.photo-wall.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.photo-wall .shots { display: grid; gap: 4px; }
.photo-wall .shots.two { grid-template-columns: 3fr 1fr; align-items: start; }
.photo-wall img.strip { aspect-ratio: auto; object-fit: contain; background: #000; }
.photo-wall .shots.two img.phone { aspect-ratio: 3 / 4; }
.photo-wall.wide .shots:not(.two) img.phone { width: 45%; }
.photo-wall .why, .review-why { color: var(--warn); font-size: 12.5px; margin-top: 4px; line-height: 1.4; }
.photo-wall figure .row { margin-top: 6px; gap: 6px; }
.scanner { position: relative; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 3 / 4; max-height: 58vh; border-radius: 16px; overflow: hidden; background: #111; }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner .scan-box { position: absolute; left: 16%; right: 16%; top: 50%; aspect-ratio: 1; transform: translateY(-50%); border: 3px solid rgba(255, 255, 255, 0.92); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.28); }
.poster-miss img { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 12px; background: var(--surface-2); display: block; }
.poster-miss ol { padding-left: 20px; margin: 10px 0; line-height: 1.7; }
.gps-line svg { width: 16px; height: 16px; }
.gps-line.ok { color: var(--ok); }
.gps-line.warn { color: var(--warn); }
.result .checks { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 12px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-size: 13px; font-weight: 500; }
.result .checks svg { width: 15px; height: 15px; }
.today-time { font-size: 56px; font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.state-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hint { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; }
.hint svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--gold); }
.hint.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.hint.warn svg { color: var(--warn); }
.hint.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.hint.bad svg { color: var(--bad); }
.rain-banner { display: flex; gap: 12px; align-items: center; background: var(--rain-soft); color: var(--rain); border-radius: var(--r-lg); padding: 14px 16px; }
.rain-banner > svg { width: 30px; height: 30px; flex: none; }
.rain-banner b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }
.rain-banner span { display: block; font-size: 14px; margin-top: 2px; }
.kiosk .rain-banner { background: #16222f; color: #8db7e6; max-width: 680px; margin: 0 auto 18px; padding: 16px 20px; }
.kiosk .rain-banner b { font-size: 20px; }
.kiosk .rain-banner span { font-size: 16px; }
.rain-thanks { color: var(--rain); font-size: 14px; margin: 10px 0 0; }
.result { text-align: center; padding: 8px 0 4px; }
.result .mark { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; background: var(--ok-soft); color: var(--ok); }
.result .mark svg { width: 38px; height: 38px; }
.result.warn .mark { background: var(--warn-soft); color: var(--warn); }
.result.bad .mark { background: var(--bad-soft); color: var(--bad); }
.result h2 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
.result p { margin: 4px 0; color: var(--ink-2); }
.result p.first { font-weight: 600; color: var(--ink); }

/* ---------- day log ---------- */
.day { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day .d { text-align: center; line-height: 1.15; }
.day .d b { display: block; font-size: 20px; font-weight: 500; }
.day .d span { font-size: 12px; color: var(--muted); }
.day .d.we span { color: var(--gold); }
.day .m b { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.day .m .s { font-size: 13px; color: var(--muted); }
.day .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

/* ---------- board ---------- */
.board-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.board-row:first-child { border-top: 0; }
.board-row .t { font-weight: 600; }
.board-row .s { font-size: 12.5px; color: var(--muted); }
.board-row .st { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---------- team calendar ---------- */
.cal { padding: 16px 8px 14px; }
.cal .monthnav { padding: 0 2px 12px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
.cal-dow.sun { color: var(--bad); }
.cal-day { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; min-height: 62px; padding: 5px 2px 4px; border-radius: 11px; border: 1px solid transparent; background: var(--surface-2); text-align: left; transition: border-color .15s, background .15s; }
.cal-day:hover { border-color: var(--line-strong); }
.cal-day .n { align-self: flex-start; min-width: 20px; padding: 3px 5px; border-radius: 99px; font-size: 12.5px; font-weight: 600; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cal-day.sun .n { color: var(--bad); }
.cal-day.today .n { background: var(--ink); color: var(--bg); }
.cal-day[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--ink) inset; }
.cal-day.closed { background: repeating-linear-gradient(135deg, var(--inset) 0 5px, transparent 5px 10px), var(--surface-2); }
.cal-day .lbl { font-size: 10px; line-height: 1.2; color: var(--muted); padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-day .credit { position: absolute; top: 7px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.cal-ppl { display: flex; flex-wrap: wrap; gap: 2px; }
.pip { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-style: normal; font-weight: 600; line-height: 1; flex: none; }
.pip.leave { background: var(--gold); color: var(--surface); }
.pip.pending { border: 1.3px dashed var(--gold); color: var(--gold); }
.pip.more { width: auto; padding: 0 2px; color: var(--muted); }
.pip.hatch { border-radius: 5px; background: repeating-linear-gradient(135deg, var(--line-strong) 0 3px, transparent 3px 6px); }
.pip.dot { width: 8px; height: 8px; background: var(--gold); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .pip { width: 14px; height: 14px; font-size: 0; }
.cal-legend .pip.dot { width: 8px; height: 8px; }
.cal-sel { border-top: 1px solid var(--line); }
.cal-sel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 4px; }
.cal-sel-h b { font-weight: 600; }
.cal-sel .item { padding-top: 10px; padding-bottom: 10px; }
.cal-sel .av { width: 34px; height: 34px; font-size: 13px; }

/* ---------- payroll ---------- */
.status-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.status-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); flex: none; }
.status-bar.approved .dot { background: var(--gold); }
.status-bar.paid .dot { background: var(--ok); }
.status-bar b { display: block; font-weight: 600; }
.status-bar span { font-size: 13px; color: var(--muted); }
.emp-card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow-1); }
.emp-card + .emp-card { margin-top: 10px; }
.emp-card .top { display: flex; align-items: center; gap: 12px; }
.emp-card .net { margin-left: auto; text-align: right; }
.emp-card .net b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.emp-card .net span { display: block; font-size: 12px; color: var(--muted); }
.emp-card .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lines { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.lines td { padding: 8px 0; vertical-align: top; border-top: 1px solid var(--line); }
.lines tr:first-child td { border-top: 0; }
.lines td.a { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; padding-left: 12px; }
.lines .d { display: block; font-size: 12.5px; color: var(--muted); }
.lines tr.total td { border-top: 1.5px solid var(--ink); font-weight: 600; }
.lines tr.neg td.a { color: var(--bad); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--r-md); }
table.log { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
table.log th, table.log td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.log th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface-2); position: sticky; top: 0; }
table.log tr:last-child td { border-bottom: 0; }
.warn-box { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-md); padding: 10px 12px; font-size: 13.5px; }
.warn-box div + div { margin-top: 4px; }

/* ---------- forms ---------- */
.field { display: block; margin-top: 14px; }
.field:first-child { margin-top: 0; }
.field > span { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; margin-bottom: 6px; }
.field small { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
.input, select.input, textarea.input { width: 100%; height: 46px; padding: 0 13px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 16px; appearance: none; -webkit-appearance: none; }
textarea.input { height: auto; min-height: 84px; padding: 11px 13px; resize: vertical; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .field { margin-top: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ink); }
.check small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 3px; }
.form-group { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
.form-group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* ---------- sheet (dialog) ---------- */
#sheet-root .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; transition: opacity .2s; }
#sheet-root .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 92vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-2); transform: translateY(24px); opacity: 0; transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .2s; max-width: 640px; margin: 0 auto; }
#sheet-root .sheet.wide { max-width: 860px; }
#sheet-root.open .scrim { opacity: 1; }
#sheet-root.open .sheet { transform: none; opacity: 1; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px 20px; }
.sheet-h h2 { font-size: 18px; font-weight: 600; margin: 0; }
.sheet-b { padding: 4px 20px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-b > * { flex-shrink: 0; }
.sheet-f { display: flex; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-f .btn { flex: 1; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 15.5px; }
.menu-item:first-child { border-top: 0; }
.menu-item svg { width: 20px; height: 20px; color: var(--ink-2); }
.menu-item.danger { color: var(--bad); }
.menu-item.danger svg { color: var(--bad); }

#toasts { position: fixed; left: 0; right: 0; bottom: 92px; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 520px; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow-2); font-size: 14.5px; pointer-events: auto; animation: rise .25s ease; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.loading-screen { min-height: 70vh; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line-strong); border-top-color: var(--ink); animation: spin .8s linear infinite; }
.skel { background: linear-gradient(90deg, var(--inset), var(--surface-2), var(--inset)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--r-lg); height: 120px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- kiosk (always dark, for the shop tablet) ---------- */
.kiosk { --k-bg: #0f0d0b; --k-surface: #1a1714; --k-line: #2c2722; --k-ink: #f4efe8; --k-muted: #9d9388; min-height: 100vh; background: radial-gradient(1200px 600px at 50% -10%, #231e18 0%, var(--k-bg) 60%); color: var(--k-ink); display: flex; flex-direction: column; }
.kiosk .k-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 0; }
.kiosk .brand .wm { font-size: 26px; color: var(--k-ink); }
.kiosk .brand .ko { color: #d2ac6b; }
.kiosk .k-clock { text-align: center; padding: 26px 16px 8px; }
.kiosk .k-clock .t { font-size: clamp(64px, 14vw, 120px); font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.kiosk .k-clock .t small { font-size: 0.32em; color: var(--k-muted); letter-spacing: 0; margin-left: 6px; }
.kiosk .k-clock .d { color: var(--k-muted); margin-top: 10px; font-size: 17px; }
.kiosk .k-body { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 18px 24px 30px; }
.kiosk .k-prompt { text-align: center; color: var(--k-muted); margin: 10px 0 18px; font-size: 16px; letter-spacing: 0.02em; }
.kiosk .live-qr { display: flex; gap: 24px; align-items: center; justify-content: center; max-width: 720px; margin: 0 auto 22px; background: var(--k-surface); border: 1px solid var(--k-line); border-radius: var(--r-xl); padding: 18px 24px; }
.live-qr-box { width: 230px; height: 230px; flex: none; background: #fff; border-radius: 16px; padding: 8px; }
.live-qr-box svg { display: block; width: 100%; height: 100%; }
.live-qr-text b { display: block; font-size: 22px; line-height: 1.35; color: var(--k-ink); }
.live-qr-text span { display: block; margin-top: 6px; color: var(--k-muted); font-size: 15px; }
.live-bar { height: 4px; margin-top: 16px; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
.live-bar i { display: block; height: 100%; background: #d2ac6b; transform-origin: left; }
@keyframes live-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (max-width: 640px) { .kiosk .live-qr { flex-direction: column; text-align: center; } .live-qr-box { width: 250px; height: 250px; } }
/* The screen's camera beside its QR: whoever scans sees themselves, and the picture is kept. */
.live-cam { position: relative; flex: none; width: 190px; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--k-line); }
.live-cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.live-cam-note { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 12px; line-height: 1.35; color: #f4efe8; background: linear-gradient(transparent, rgba(0, 0, 0, 0.72)); text-align: center; }
.live-qr.cam-covered .live-cam, .live-qr.cam-none .live-cam { outline: 3px solid #e0a458; outline-offset: -3px; }
.live-qr.cam-covered .live-cam-note, .live-qr.cam-none .live-cam-note { top: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.7); font-size: 14px; padding: 12px; }
.live-qr-off { width: 100%; height: 100%; display: grid; place-items: center; color: #a1968a; font-size: 18px; text-align: center; background: #f4efe8; border-radius: 10px; }
.cam-feed { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
.k-update { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 680px; margin: 0 auto 16px; padding: 12px 16px; border-radius: var(--r-lg); background: #2a241e; color: #e9d9bd; text-decoration: none; font-weight: 600; }
.k-update svg { width: 18px; height: 18px; }
@media (max-width: 640px) { .live-cam { width: 170px; } }
.kiosk .names { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.kiosk .name-tile { background: var(--k-surface); border-color: var(--k-line); box-shadow: none; color: var(--k-ink); padding: 18px; }
.kiosk .name-tile .grow span { color: var(--k-muted); }
.kiosk .name-tile.done { opacity: 0.55; }
.kiosk .name-tile .ok { margin-left: auto; color: #7fc9a0; }
.kiosk .name-tile .ok svg { width: 22px; height: 22px; }
.kiosk .av { background: #2a241e; color: #e9d9bd; width: 46px; height: 46px; font-size: 17px; }
.kiosk .group-h { color: var(--k-muted); }
.kiosk .key { background: var(--k-surface); border-color: var(--k-line); color: var(--k-ink); box-shadow: none; height: 76px; font-size: 30px; }
.kiosk .key.fn { background: transparent; color: var(--k-muted); }
.kiosk .pin-dots i { border-color: #5a5047; }
.kiosk .pin-dots i.on { background: #f4efe8; border-color: #f4efe8; }
.kiosk .btn { background: var(--k-surface); border-color: var(--k-line); color: var(--k-ink); }
.kiosk .btn.primary { background: #f4efe8; color: #171412; border-color: #f4efe8; }
.kiosk .chip { background: var(--k-surface); border-color: var(--k-line); color: var(--k-ink); }
.kiosk .chip > span { color: var(--k-muted); }
.kiosk .chip[aria-pressed="true"] { border-color: #f4efe8; box-shadow: 0 0 0 1px #f4efe8 inset; }
.kiosk .muted { color: var(--k-muted); }
.kiosk .hint { background: var(--k-surface); border-color: var(--k-line); color: var(--k-muted); }
.k-panel { max-width: 720px; margin: 0 auto; }
.k-confirm { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.cam { position: relative; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; background: #000; border: 1px solid var(--k-line); }
.cam video, .cam img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.cam .cam-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--k-muted); font-size: 14px; text-align: center; padding: 20px; }
.k-result { text-align: center; padding: 30px 0; }
.k-result .mark { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; background: rgba(127, 201, 160, 0.14); color: #7fc9a0; }
.k-result .mark svg { width: 56px; height: 56px; }
.k-result.warn .mark { background: rgba(230, 180, 100, 0.14); color: #e6b464; }
.k-result.bad .mark { background: rgba(240, 140, 130, 0.14); color: #f08c82; }
.k-result h2 { font-size: 34px; font-weight: 400; margin: 0 0 10px; }
.k-result p { color: var(--k-muted); font-size: 18px; margin: 6px 0; }
.k-result p.first { color: var(--k-ink); font-weight: 500; }
.k-count { height: 3px; background: var(--k-line); border-radius: 3px; overflow: hidden; max-width: 320px; margin: 26px auto 0; }
.k-count i { display: block; height: 100%; background: #d2ac6b; animation: count linear forwards; }
@keyframes count { from { width: 100%; } to { width: 0; } }
.k-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 28px 20px; color: var(--k-muted); font-size: 13px; }
.k-foot button { background: none; border: 0; color: var(--k-muted); font-size: 13px; }

/* ---------- payslip document ---------- */
.slip-doc { background: #fff; color: #1c1917; border-radius: 6px; padding: 28px 26px; font-size: 13px; line-height: 1.5; border: 1px solid #e6e0d6; max-width: 560px; margin: 0 auto; }
.slip-doc .sd-head { display: flex; justify-content: space-between; gap: 18px; border-bottom: 1.5px solid #1c1917; padding-bottom: 14px; }
.slip-doc .sd-co b { font-size: 15px; font-weight: 600; display: block; margin-bottom: 2px; }
.slip-doc .sd-co span { display: block; color: #57534e; font-size: 11px; }
.slip-doc .sd-title { text-align: right; flex: none; }
.slip-doc .sd-title b { font-size: 18px; font-weight: 600; display: block; }
.slip-doc .sd-title span { display: block; color: #57534e; }
.slip-doc .sd-info { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 16px 0 18px; }
.slip-doc .sd-info dt { color: #78716c; }
.slip-doc .sd-info dd { margin: 0; }
.slip-doc .sd-info b { font-weight: 600; }
.slip-doc table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.slip-doc th { text-align: left; font-size: 11px; font-weight: 600; color: #78716c; padding: 0 0 6px; border-bottom: 1px solid #d6d3d1; }
.slip-doc td { padding: 6px 0; border-bottom: 1px solid #efebe7; vertical-align: top; }
.slip-doc td small { color: #78716c; margin-left: 8px; font-size: 12px; }
.slip-doc .a { text-align: right; white-space: nowrap; padding-left: 10px; }
.slip-doc tfoot td { border-bottom: 0; font-weight: 600; padding-top: 8px; }
.slip-doc .sd-net { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid #1c1917; padding-top: 12px; }
.slip-doc .sd-net span { font-weight: 600; font-size: 15px; }
.slip-doc .sd-net b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.slip-doc .sd-net small { font-size: 13px; font-weight: 500; }

/* ---------- QR poster ---------- */
.poster { background: #fff; color: #171412; border-radius: 8px; padding: 34px 28px; text-align: center; max-width: 420px; margin: 0 auto; border: 1px solid #e6e0d6; }
.poster .brand .wm { font-size: 30px; color: #171412; }
.poster .crest { height: 64px; margin-bottom: 12px; }
.poster .qr { width: 260px; height: 260px; margin: 20px auto 16px; }
.poster .qr svg { width: 100%; height: 100%; }
.poster h3 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.poster p { margin: 4px 0; color: #57504a; font-size: 14px; }
.poster .code { font-size: 12px; color: #8a8178; margin-top: 14px; letter-spacing: 0.1em; }

@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .big { font-size: 38px; }
  .slip-doc { padding: 20px 16px; }
  .slip-doc .sd-head { flex-direction: column; }
  .slip-doc .sd-title { text-align: left; }
  .slip-doc .sd-info { grid-template-columns: 96px 1fr; }
}
@media (max-width: 760px) {
  .k-confirm { grid-template-columns: 1fr; }
  .kiosk .k-body { padding: 14px 16px 24px; }
  .kiosk .names { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (min-width: 900px) {
  :root { --wrap: 720px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media print {
  body { background: #fff; }
  body > *:not(#sheet-root) { display: none !important; }
  #sheet-root .scrim, .sheet-h, .sheet-f, .no-print { display: none !important; }
  #sheet-root .sheet { position: static; transform: none; opacity: 1; box-shadow: none; max-height: none; border-radius: 0; max-width: none; }
  .sheet-b { overflow: visible; padding: 0; }
  .slip-doc, .poster { border: 0; }
  /* On paper the QR must read from a selfie a metre away: make it big. */
  .poster { max-width: none; padding: 0; }
  .poster .qr { width: 15cm; height: 15cm; margin: 0.5cm auto 0.4cm; }
  .poster .crest { height: 2.2cm; }
  .poster h3 { font-size: 26pt; }
  .poster p { font-size: 15pt; }
}
</style>

  /**

        if (res && res.ok) resolve(res.data);

        // text/plain so no preflight, and without Google's cookies, so a phone

      <div class="now-clock"><span data-clock="hms">${hmsNow()}</span><small>เวลาตอนนี้</small></div>${clockButtonArea(st)}</section>`;
  }
  function distM(a, b, c, d) {
    var r = Math.PI / 180, x = Math.sin(((c - a) * r) / 2), y = Math.sin(((d - b) * r) / 2);
    return 12742000 * Math.asin(Math.sqrt(x * x + Math.cos(a * r) * Math.cos(c * r) * y * y));
  }
  function distText(m) { return m < 1000 ? Math.round(m) + ' ม.' : (Math.round(m / 100) / 10) + ' กม.'; }
  /** Where the phone is, before pressing: the server checks again. */

    }
    var d = distM(g.lat, g.lng, shop.lat, shop.lng);
    var inside = d - Math.min(Math.max(g.acc || 0, 0), 100) <= B.clock.radius;
    return html`<div class="gps-line ${inside ? 'ok' : 'warn'}">${icon('pin')}<span>${inside ? 'อยู่ในร้าน' : 'อยู่ห่างร้าน ' + distText(d) + ' — ต้องอยู่ในร้านจึงจะลงเวลาได้'}</span></div>`;

  // ---- phone clock-in -----------------------------------------------------
  function phoneClockIn(btn) {
    if (!S.shift) { toast('เลือกกะก่อน', 'bad'); return; }
    if (B.clock.poster) { posterClockIn(btn); return; }
    var selfie = B.clock.selfie;
    var scanned = scannedOk();
    if (selfie && B.clock.phoneQr && !scanned) {
      // A phone opens one camera per tap, so the QR is its own tap before the selfie.
      scanShopQr().then(function (q) {
        S.scanCode = q.qr;
        S.scanInApp = !!q.inApp;
        S.scanReadAt = q.readAt || '';
        render();
        toast('สแกน QR แล้ว — กดถ่ายรูปและลงเวลาได้เลย', 'ok');
      }, function (e) { if (!/^ยังไม่ได้/.test(e.message)) toast(e.message, 'bad'); });
      return;
    }
    // The camera must open right away from the tap, before anything waits.
    var shot = selfie ? takeSelfie() : Promise.resolve(null);
    // Already scanned (in the app, or by the link where links count), else scan now.
    var qrStep = scanned ? Promise.resolve({ qr: S.scanCode, inApp: S.scanInApp, readAt: S.scanReadAt }) : B.clock.phoneQr ? scanShopQr() : Promise.resolve({});
    spin(btn, true);
    Promise.all([shot, qrStep]).then(function (r) {
      var me = r[0];
      var q = r[1];
      var fresh = S.geo && Date.now() - S.geo.t < 30000;
      return (fresh ? Promise.resolve(S.geo) : locate(true)).then(function (g) {
        var data = { shift: S.shift, device: deviceId(), qr: q.qr || '', scannedInApp: !!q.inApp, qrPhoto: !!q.fromPhoto, qrReadAt: q.readAt || '', photo: me ? me.photo : q.photo || '', photoAge: me ? me.age : q.age };
        if (g) { data.lat = g.lat; data.lng = g.lng; data.acc = g.acc; }
        return call('clock', data, staffAuth());
      });
    }).then(function (res) {
      spin(btn, false);
      S.scanCode = '';
      S.scanInApp = false;
      S.scanReadAt = '';
      S.home.status = res.status;
      loadHome(true);
      render();
      showResult(res.result);
    }, function (e) {
      spin(btn, false);
      if (e.code === 'QR' || e.code === 'QR_OLD' || e.code === 'CLOCK') { S.scanCode = ''; S.scanInApp = false; S.scanReadAt = ''; render(); }
      if (e.message === 'ยังไม่ได้สแกน') return;
      if (e.message === 'ยังไม่ได้ถ่ายรูป') { if (selfie) toast('ต้องถ่ายรูปตัวเองจึงจะลงเวลาได้ — กดอีกครั้ง', 'bad'); return; }
      toast(e.message, 'bad');
    });
  }
  /**
   * Clock in with a selfie beside the shop's QR poster: the QR read from the
   * photo proves the phone is in the shop. When it cannot be read, the person
   * takes it again, or sends that photo for the approver to look at.
   */
  function posterClockIn(btn, forReview) {
    if (!S.shift) { toast('เลือกกะก่อน', 'bad'); return; }
    // The camera must open right away from the tap, before anything waits.
    var shot = forReview && S.posterShot ? Promise.resolve(S.posterShot) : takeSelfie(true);
    spin(btn, true);
    shot.then(function (me) {
      S.posterShot = me;
      if (!me.qr && !forReview) { spin(btn, false); posterMiss(me); return null; }
      var fresh = S.geo && Date.now() - S.geo.t < 30000;
      return (fresh ? Promise.resolve(S.geo) : locate(true)).then(function (g) {
        var data = { shift: S.shift, device: deviceId(), qr: forReview ? '' : me.qr, qrInPhoto: !forReview, review: !!forReview, photo: me.photo, photoAge: me.age };
        if (g) { data.lat = g.lat; data.lng = g.lng; data.acc = g.acc; }
        return call('clock', data, staffAuth());
      });
    }).then(function (res) {
      if (!res) return;
      spin(btn, false);
      S.posterShot = null;
      S.scanCode = '';
      S.home.status = res.status;
      loadHome(true);
      render();
      showResult(res.result);
    }, function (e) {
      spin(btn, false);
      if (e.message === 'ยังไม่ได้ถ่ายรูป') { toast('ต้องถ่ายรูปข้างป้ายจึงจะลงเวลาได้ — กดอีกครั้ง', 'bad'); return; }
      if ((e.code === 'POSTER' || e.code === 'QR' || e.code === 'QR_OLD') && S.posterShot && !forReview) { posterMiss(S.posterShot, e.message); return; }
      toast(e.message, 'bad');
    });
  }

      : n.state === 'done' ? 'โพสต์ประกาศในกลุ่ม LINE เองแล้ว'
      : n.state === 'skipped' ? 'ไม่ได้ประกาศในกลุ่ม LINE'
      : n.auto ? 'ระบบจะประกาศกติกาใหม่ในกลุ่ม LINE พนักงานเอง ช่วง 9:00–20:00 น.' + (n.error ? ' (ครั้งก่อนส่งไม่สำเร็จ: ' + n.error + ')' : '')

      : n.error ? 'ส่งเข้ากลุ่ม LINE ไม่สำเร็จ (' + n.error + ') — กดส่งอีกครั้ง หรือคัดลอกไปโพสต์เอง'
      : 'ยังไม่ได้ประกาศกติกาใหม่ (ปิดประกาศอัตโนมัติไว้ในตั้งค่า) — คัดลอกข้อความไปโพสต์ในกลุ่มพนักงานเอง';
    return html`<section class="card pad-lg"><div class="card-h"><span class="eyebrow">อัปเดตแอปแล้ว · รุ่น ${up.to}</span><span class="small muted">${when(up.at)}</span></div>

        <div class="row wrapx" style="margin-top:10px;gap:8px">
          <button class="btn" data-act="update-text">${icon('chat')} ${pending ? 'ดู / คัดลอกข้อความ' : 'ดูข้อความ'}</button>

        <label class="check"><input type="checkbox" id="kiosk-live" checked><span><b>ใช้จอนี้แทนป้าย QR กระดาษ (แนะนำ)</b><small>ลงเวลาได้เฉพาะ QR บนจอนี้ที่เปลี่ยนทุก 5 วินาที ป้ายที่พิมพ์ รูปที่ถ่ายไว้ หรือลิงก์ที่ส่งต่อ ใช้ไม่ได้ และปิดการใส่ PIN ที่จอ (กันใช้ PIN ของคนอื่นลงแทน)</small></span></label>`,
        foot: html`<button class="btn" data-act="sheet-close">ยกเลิก</button><button class="btn primary" data-act="kiosk-add-go">ตั้งเป็นจอลงเวลา</button>` });
    },
    'kiosk-add-go': function (el) {
      run(el, call('kioskAdd', { name: $('#kiosk-name').value, liveQr: !!($('#kiosk-live') || {}).checked }, ownerAuth())).then(function (d) {
        closeSheet();
        S.kiosk = { token: d.token, id: d.kiosk.id, name: d.kiosk.name };
        LS.set(KEY.kiosk, S.kiosk);
        LS.del(KEY.owner); S.owner = null;
        start();
        toast('เครื่องนี้เป็นจอลงเวลาแล้ว', 'ok');
      }, function () {});
    },
    'kiosk-remove': function (el) {
      confirmSheet({ title: 'ยกเลิกเครื่องลงเวลา', text: 'เครื่องนี้จะลงเวลาไม่ได้อีก', yes: 'ยกเลิกเครื่อง', danger: true }).then(function (ok) {
        if (!ok) return;
        call('kioskRemove', { id: el.dataset.id }, ownerAuth()).then(function (d) { S.ownerHome = d; render(); toast('ยกเลิกแล้ว', 'ok'); }, function (e) { toast(e.message, 'bad'); });
      });
    },
    'line-code': function (el) { run(el, call('lineCode', {}, ownerAuth())).then(function (d) { S.ownerHome.line.linkCode = d.linkCode; render(); }, function () {}); },
    'backup': function (el) { run(el, call('backup', {}, ownerAuth())).then(function (d) { toast(d.notice, 'ok'); }, function () {}); },
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') && !/^#/.test(el.getAttribute('href'))) return;
    ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'cam-env' || el.id === 'cam-user') { onCameraFile(el); return; }
    if (el.dataset.change === 'lv-type') {
      var t = (B.leaveTypes || []).filter(function (x) { return x.type === el.value; })[0];
      var n = $('#lv-note'); if (n) n.textContent = leaveTypeNote(t);
    }
    if (el.dataset.change === 'en-type') {
      var o = { type: el.value, emp: $('#en-emp').value, date: $('#en-date').value, reason: $('#en-reason').value };
      setSheetBody(entryForm(o));
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.view === 'kiosk') {
      // The screen woke up: timers slept with it, so show a fresh QR now, and bring the camera back.
      keepAwake();
      if (S.k.step === 'names') drawLiveQr();
      if (camWanted()) { startScreenCam(); attachMirror(); }
      pingSoon(500);
      return;
    }
    // Back in the app after a while: refresh today (rain, approvals) quietly.
    if (document.visibilityState !== 'visible' || S.view !== 'staff' || !S.home || sheetState) return;
    if (Date.now() - (S.homeAt || 0) > 120000) loadHome(true);
  });
  window.addEventListener('focus', function () {
    // The camera app closed without a picture: release the pending promise.
    setTimeout(function () {
      if (pendingCamera && !($('#cam-env').files || []).length && !($('#cam-user').files || []).length) {
        var p = pendingCamera; pendingCamera = null; p.reject(new Error('ยังไม่ได้ถ่ายรูป'));
      }
    }, 1200);
  });
  document.addEventListener('keydown', function (ev) {
    var pinView = S.view === 'pin' || S.view === 'ownerLogin' || (S.view === 'kiosk' && S.k.step === 'pin');
    if (!pinView || sheetState) return;
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('del');
    else if (ev.key === 'Enter') pinKey('ok');
  });
  window.addEventListener('scroll', function () {
    var bar = $('.topbar');
    if (bar) bar.classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  // Clock displays tick without re-rendering the page.
  function tick() {
    var n = now();
    var p = parts(n);
    document.querySelectorAll('[data-clock]').forEach(function (el) {
      if (el.dataset.clock === 'big') el.innerHTML = pad(p.hh) + ':' + pad(p.mi) + '<small>' + pad(p.ss) + '</small>';
      else if (el.dataset.clock === 'hms') el.textContent = pad(p.hh) + ':' + pad(p.mi) + ':' + pad(p.ss);
      else if (el.dataset.clock === 'day') el.textContent = thDateLong(ymdOf(n));
      else el.textContent = thDateLong(ymdOf(n)) + (el.dataset.clock === 'date' && S.view !== 'kiosk' ? ' · ' + pad(p.hh) + ':' + pad(p.mi) + ' น.' : '');
    });
  }
  setInterval(tick, 1000);

  // ======================================================================
  // Start
  // ======================================================================
  function start() {
    if (B.error) { S.view = 'error'; render(); return; }
    if (B.siteUrl && !S.stay) { S.view = 'moved'; render(); return; }
    if (S.kiosk && S.kiosk.token) {
      S.view = 'loading'; render();
      call('boot', { kiosk: S.kiosk.token, v: CODE_VERSION }).then(function (b) {
        if (b.kioskInvalid) { LS.del(KEY.kiosk); S.kiosk = null; toast('เครื่องนี้ถูกยกเลิกการเป็นเครื่องลงเวลาแล้ว', 'bad'); start(); return; }
        B = Object.assign(B, b);
        S.kiosk.name = b.kiosk.name;
        S.view = 'kiosk';
        kioskDone(b);
        kioskReset();
        setInterval(kioskRefresh, 5 * 60000);
        pingSoon(1500);
      }, function (e) { S.view = 'kiosk'; kioskReset(); toast(e.message, 'bad'); pingSoon(20000); });
      return;
    }
    if (B.page === 'owner' || (S.owner && !S.staff)) {
      if (S.owner) { S.view = 'loading'; render(); ownerLogin(S.owner.pin, true, true); }
      else { S.view = 'ownerLogin'; render(); }
      return;
    }
    if (S.staff) {
      S.view = 'loading'; render();
      loadHome(true).then(function (d) {
        if (d) { S.view = 'staff'; render(); }
        else if (S.view === 'loading') { S.view = 'start'; render(); toast('เชื่อมต่อไม่ได้ กรุณาลองใหม่', 'bad'); }
      });
      return;
    }
    S.view = 'start';
    render();
  }

  /**
   * The page's first step. On the shop's site the boot data comes from the
   * server (Google's page has it written in), after taking in what Google's
   * page handed over.
   */
  function boot() {
    if (!SITE) { start(); return; }
    takeHandoff();
    var q = new URLSearchParams(location.search);
    call('boot', { page: SITE.page || q.get('page') || '', scan: q.get('in') || q.get('qr') || '', v: CODE_VERSION }).then(function (b) {
      B = Object.assign(B, b);
      if (B.scan) S.scanCode = B.scan;
      start();
    }, function (e) {
      B.error = e.message + ' — ตรวจอินเทอร์เน็ตแล้วลองใหม่';
      S.view = 'error';
      render();
    });
  }

  // ---- the move from Google's page to the shop's site ----------------------
  // Each has its own memory in the phone, so the button carries this phone's
  // login, shop screen and device id across, in the address's #fragment
  // (never sent to a server), once.
  var HANDOFF = [['staff', KEY.staff], ['owner', KEY.owner], ['kiosk', KEY.kiosk], ['device', KEY.device]];
  function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64url(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))); }
  function movedUrl() {
    var owner = !S.kiosk && (B.page === 'owner' || (!!S.owner && !S.staff));
    var url = B.siteUrl + (owner ? 'owner.html' : '');
    if (B.scan) url += (B.scan.indexOf('.') >= 0 ? '?in=' : '?qr=') + encodeURIComponent(B.scan);
    var carry = {};
    HANDOFF.forEach(function (h) { var v = LS.get(h[1]); if (v) carry[h[0]] = v; });
    return Object.keys(carry).length ? url + '#move=' + b64url(JSON.stringify(carry)) : url;
  }
  function takeHandoff() {
    var m = /[#&]move=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the address keeps it */ }
    var got = null;
    try { got = JSON.parse(unb64url(m[1])); } catch (e) { return; }
    if (!got || typeof got !== 'object') return;
    // What this site already remembers wins.
    HANDOFF.forEach(function (h) { if (got[h[0]] && !LS.get(h[1])) LS.set(h[1], got[h[0]]); });
    S.staff = LS.get(KEY.staff);
    S.owner = LS.get(KEY.owner);
    S.kiosk = LS.get(KEY.kiosk);
  }
  VIEWS.moved = function () {
    return html`<div class="wrap page"><div class="start-head">${brand(true)}</div>
      <div class="card pad-lg center stack"><h2 class="title">แอปย้ายไปที่ใหม่แล้ว</h2>
        <p class="muted mt0">ที่ใหม่ไม่มีแถบฟ้าของ Google และกล้องสแกน QR เปิดได้ · ${S.kiosk ? 'จอนี้ย้ายไปพร้อมการตั้งค่า ไม่ต้องตั้งใหม่' : S.staff || S.owner ? 'แอปจำชื่อและ PIN ไปให้' : 'ครั้งแรกเลือกชื่อแล้วใส่ PIN'}</p>
        <a class="btn primary block" href="${movedUrl()}" target="_top">ไปที่แอปใหม่</a>
        ${S.kiosk ? '' : html`<p class="small muted">แล้วเพิ่มหน้าใหม่ลงหน้าจอโฮม (iPhone: Safari › ปุ่มแชร์ › เพิ่มไปยังหน้าจอโฮม) ไอคอนเดิมลบได้</p>`}
        <button class="btn ghost sm" data-act="stay-old">ใช้หน้าเดิมชั่วคราว</button></div></div>`;
  };

  // Hooks for the demo page and for tests.
  window.SeoulfulApp = {
    reset: function () { closeSheet(); stopCamera(); LS.del(KEY.staff); LS.del(KEY.owner); LS.del(KEY.kiosk); S.staff = null; S.owner = null; S.kiosk = null; S.home = null; S.ownerHome = null; S.pay = null; S.team = null; S.leaves = null; S.employees = null; S.tab = 'home'; S.sub = null; S.ownerTab = 'overview'; S.k.done = {}; S.view = 'start'; render(); },
    loginStaff: function (id, pin) { S.pickId = id; S.view = 'pin'; submitPin(pin); },
    loginOwner: function (pin) { S.view = 'ownerLogin'; ownerLogin(pin, false); },
    kiosk: function (token, id, name) { S.kiosk = { token: token, id: id, name: name }; start(); },
    // As if the page was opened by scanning the shop's QR poster with the phone camera.
    scan: function (code) { S.scanCode = code; if (S.view === 'staff') { S.tab = 'home'; S.sub = null; render(); } },
    // Forget the last position and look again (the demo moves the phone).
    relocate: function () { S.geo = null; if (S.view === 'staff') { warmGps(); render(); } },
    // Load today again (the demo changes the weather).
    refresh: function () {
      if (S.view === 'staff') { loadHome(true); if (S.tab === 'team') loadTeam(); }
      else if (S.view === 'kiosk') kioskRefresh();
    },
    // Read the shop's QR out of a picture, as a selfie would be read (browser checks).
    findQrInPhoto: findQrInPhoto,
    state: S,
  };
  boot();
})();
</script>
</body>
</html>
