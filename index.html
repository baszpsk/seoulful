        <div class="sd-title"><b>ใบแจ้งเงินเดือน</b><span>${p.period.month}</span></div></div>
      <dl class="sd-info"><dt>ชื่อ-นามสกุล</dt><dd><b>${e.fullName}</b></dd><dt>รอบเงินเดือน</dt><dd>${p.period.label}</dd><dt>วันที่จ่าย</dt><dd>${p.payDate ? thDate(p.payDate) : '-'}</dd><dt>วันทำงาน</dt><dd>${p.counts.workDays} วัน</dd></dl>
      <table><thead><tr><th>รายได้</th><th class="a">บาท</th></tr></thead><tbody>${rows(p.earnings)}</tbody><tfoot><tr><td>รวมรายได้</td><td class="a">${money(p.gross, true)}</td></tr></tfoot></table>
      <table><thead><tr><th>รายการหัก</th><th class="a">บาท</th></tr></thead><tbody>${p.deductions.length ? rows(p.deductions) : html`<tr><td class="muted">ไม่มี</td><td class="a">0.00</td></tr>`}</tbody><tfoot><tr><td>รวมรายการหัก</td><td class="a">${money(p.deductTotal, true)}</td></tr></tfoot></table>
      <div class="sd-net"><span>รับสุทธิ</span><b>${money(p.net, true)} <small>บาท</small></b></div>
    </div>`;
  }
  // Payslips as fetched this session. The newest is fetched when the list
  // opens, and kept on this phone: tapping it opens it at once.
  var slipBy = {};
  function slipHere(key) {
    if (!slipBy[key]) { var m = lastPart('slip', key); if (m) slipBy[key] = m.data; }
    return slipBy[key] || null;
  }
  function fetchSlip(key) {
    return call('payslip', { period: key }, staffAuth()).then(function (d) {
      slipBy[key] = d;
      keepPart('slip', d, key);
      return d;
    });
  }
  function prefetchSlip() {
    var list = (S.home && S.home.payslips) || [];
    if (list.length && !slipHere(list[0].key)) fetchSlip(list[0].key).catch(function () {});
  }
  function openSlip(key, btn) {
    var show = function (d) {
      openSheet({ title: 'สลิปเงินเดือน ' + d.payslip.period.month, wide: true, body: slipDoc(d.payslip),
        foot: html`${HOOKS.noPrint ? '' : html`<button class="btn" data-act="print">${icon('print')} พิมพ์ / PDF</button>`}<button class="btn primary" data-act="save-image" data-target="#slip-doc" data-name="payslip-${key}">${icon('image')} บันทึกเป็นรูป</button>` });
    };
    var have = slipHere(key);
    if (have) show(have);
    else run(btn, fetchSlip(key)).then(show, function () {});
  }
  function saveImage(sel, name, btn) {
    var el = $(sel);
    if (!el) return;
    spin(btn, true);
    loadScript(LIBS.html2canvas).then(function () {
      return window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    }).then(function (canvas) {
      spin(btn, false);
      var url = canvas.toDataURL('image/png');
      openSheet({ title: 'บันทึกรูป', wide: true, body: html`<p class="muted small mt0">${HOOKS.noDownload || 'กดค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" หรือกดปุ่มด้านล่าง'}</p><img src="${url}" alt="${name}" style="width:100%;border-radius:8px;border:1px solid var(--line)">`,
        foot: HOOKS.noDownload ? '' : html`<a class="btn primary" href="${url}" download="${name}.png">${icon('download')} ดาวน์โหลด</a>` });
    }, function (e) { spin(btn, false); toast(e.message || 'บันทึกรูปไม่สำเร็จ', 'bad'); });
  }

  // ---- phone clock-in -----------------------------------------------------
  function phoneClockIn(btn) {
    if (!S.shift) { toast('เลือกกะก่อน', 'bad'); return; }
    if (B.clock.poster) { posterClockIn(btn); return; }
    var selfie = B.clock.selfie;
    var scanned = scannedOk();
    if (selfie && B.clock.phoneQr && !scanned) {
      // A phone opens one camera per tap, so the QR is its own tap before the selfie.
      scanShopQr().then(function (q) {
        S.scanCode = q.qr;
        S.scanInApp = !!q.inApp;
        S.scanReadAt = q.readAt || '';
        render();
        toast('สแกน QR แล้ว — กดถ่ายรูปและลงเวลาได้เลย', 'ok');
      }, function (e) { if (!/^ยังไม่ได้/.test(e.message)) toast(e.message, 'bad'); });
      return;
    }
    // The camera must open right away from the tap, before anything waits.
    var shot = selfie ? takeSelfie() : Promise.resolve(null);
    // Already scanned (in the app, or by the link where links count), else scan now.
    var qrStep = scanned ? Promise.resolve({ qr: S.scanCode, inApp: S.scanInApp, readAt: S.scanReadAt }) : B.clock.phoneQr ? scanShopQr(true) : Promise.resolve({});
    spin(btn, true);
    Promise.all([shot, qrStep]).then(function (r) {
      var me = r[0];
      var q = r[1];
      showSaving();
      var fresh = S.geo && Date.now() - S.geo.t < 30000;
      return (fresh ? Promise.resolve(S.geo) : locate(true)).then(function (g) {
        var data = { shift: S.shift, device: deviceId(), qr: q.qr || '', scannedInApp: !!q.inApp, qrPhoto: !!q.fromPhoto, qrReadAt: q.readAt || '', photo: me ? me.photo : q.photo || '', photoAge: me ? me.age : q.age };
        if (g) { data.lat = g.lat; data.lng = g.lng; data.acc = g.acc; }
        return call('clock', data, staffAuth());
      });
    }).then(function (res) {
      spin(btn, false);
      S.scanCode = '';
      S.scanInApp = false;
      S.scanReadAt = '';
      S.home.status = res.status;
      loadHome(true, true);
      render();
      showResult(res.result);
    }, function (e) {
      spin(btn, false);
      if (e.network) { clockAnswerLost(e); return; }
      savingDone();
      if (e.code === 'QR' || e.code === 'QR_OLD' || e.code === 'CLOCK') { S.scanCode = ''; S.scanInApp = false; S.scanReadAt = ''; render(); }
      if (e.message === 'ยังไม่ได้สแกน') return;
      if (e.message === 'ยังไม่ได้ถ่ายรูป') { if (selfie) toast('ต้องถ่ายรูปตัวเองจึงจะลงเวลาได้ — กดอีกครั้ง', 'bad'); return; }
      toast(e.message, 'bad');
    });
  }
  /**
   * Clock in with a selfie beside the shop's QR poster: the QR read from the
   * photo proves the phone is in the shop. When it cannot be read, the person
   * takes it again, or sends that photo for the approver to look at.
   */
  function posterClockIn(btn, forReview) {
    if (!S.shift) { toast('เลือกกะก่อน', 'bad'); return; }
    // The camera must open right away from the tap, before anything waits.
    var shot = forReview && S.posterShot ? Promise.resolve(S.posterShot) : takeSelfie(true);
    spin(btn, true);
    shot.then(function (me) {
      S.posterShot = me;
      if (!me.qr && !forReview) { spin(btn, false); posterMiss(me); return null; }
      showSaving();
      var fresh = S.geo && Date.now() - S.geo.t < 30000;
      return (fresh ? Promise.resolve(S.geo) : locate(true)).then(function (g) {
        var data = { shift: S.shift, device: deviceId(), qr: forReview ? '' : me.qr, qrInPhoto: !forReview, review: !!forReview, photo: me.photo, photoAge: me.age };
        if (g) { data.lat = g.lat; data.lng = g.lng; data.acc = g.acc; }
        return call('clock', data, staffAuth());
      });
    }).then(function (res) {
      if (!res) return;
      spin(btn, false);
      S.posterShot = null;
      S.scanCode = '';
      S.home.status = res.status;
      loadHome(true, true);
      render();
      showResult(res.result);
    }, function (e) {
      spin(btn, false);
      if (e.network) { clockAnswerLost(e); return; }
      // The poster's sheet takes the saving one's place; otherwise it goes, and a message says why.
      if ((e.code === 'POSTER' || e.code === 'QR' || e.code === 'QR_OLD') && S.posterShot && !forReview) { posterMiss(S.posterShot, e.message); return; }
      savingDone();
      if (e.message === 'ยังไม่ได้ถ่ายรูป') { toast('ต้องถ่ายรูปข้างป้ายจึงจะลงเวลาได้ — กดอีกครั้ง', 'bad'); return; }
      toast(e.message, 'bad');
    });
  }
  /**
   * The clock-in went out but its answer was lost (the network, or Google's
   * side): it may have been saved. Ask for today's status before saying
   * anything, so nobody presses again for nothing or thinks it failed.
   */
  function clockAnswerLost(e) {
    var before = !!(S.home && S.home.status && S.home.status.checkedIn);
    toast('เน็ตสะดุด — กำลังตรวจว่าลงเวลาแล้วหรือยัง…');
    loadHome(true, true).then(function (d) {
      var st = d && d.status;
      if (!st) { savingDone(); toast('เน็ตสะดุด ยังตรวจไม่ได้ว่าลงเวลาแล้วหรือยัง — รอสักครู่แล้วเปิดแอปใหม่ก่อนกดอีกครั้ง', 'bad'); return; }
      if (st.checkedIn && !before) {
        S.scanCode = ''; S.scanInApp = false; S.scanReadAt = ''; S.posterShot = null;
        render();
        showResult({ tone: 'ok', title: 'ลงเวลาเรียบร้อย', lines: ['เข้างาน ' + String(st.today.in).slice(0, 5) + ' น. · ' + st.today.shiftName], checks: '' });
        return;
      }
      savingDone();
      toast('ยังไม่ได้ลงเวลา (เน็ตสะดุด) — กดลงเวลาอีกครั้ง', 'bad');
    });
  }
  function posterMiss(me, why) {
    openSheet({ title: 'ไม่เห็นป้าย QR ในรูป', body: html`<div class="poster-miss"><img src="${me.photo}" alt="รูปที่เพิ่งถ่าย">
        <p class="small">${why || 'ระบบหา QR ของร้านในรูปนี้ไม่เจอ'}</p>
        <ol class="small muted"><li>ยืน<b>ข้าง</b>ป้าย QR ที่ติดในร้าน อย่ายืนบังป้าย</li><li>ถือมือถือให้เห็นทั้งหน้าและป้ายทั้งแผ่น</li><li>มีแสงสะท้อนบนป้าย ขยับมุมเล็กน้อย</li></ol>
        <p class="tiny muted mt0">ถ่ายหลายครั้งแล้วยังไม่ผ่าน กด "ส่งให้ผู้อนุมัติตรวจ" ได้ ผู้อนุมัติจะดูจากรูปว่าอยู่ในร้าน</p></div>`,
      foot: html`<button class="btn" data-act="poster-review">ส่งให้ผู้อนุมัติตรวจ</button><button class="btn primary" data-act="poster-retake">${icon('camera')} ถ่ายใหม่</button>` });
  }
  /**
   * The clock-in on its way: its result's place at once (the scanner's sheet
   * becomes it), with the shift picked; the server's answer fills it in.
   */
  function showSaving() {
    var sh = shiftOf(S.home && S.home.status, S.shift);
    openSheet({ title: 'ลงเวลาเข้างาน', saving: true, body: html`<div class="result-wait" aria-busy="true"><div class="mark">${icon('clock')}</div><h2>กำลังบันทึกเวลาเข้างาน</h2>${sh ? html`<p class="first">${sh.type} · เริ่ม ${sh.start} น.</p>` : ''}</div>` });
  }
  /** The saving sheet, when still up, goes (a message says what happened). */
  function savingDone() { if (sheetState && sheetState.saving) closeSheet(); }
  function showResult(r) {
    openSheet({ title: 'ลงเวลาเข้างาน', body: html`<div class="result ${r.tone}"><div class="mark">${icon(r.tone === 'ok' ? 'check' : 'alert')}</div><h2>${r.title}</h2>${r.lines.map(function (l, i) { return html`<p class="${i === 0 ? 'first' : ''}">${l}</p>`; })}${r.checks ? html`<div class="checks">${icon('shield')}<span>ตรวจแล้ว: ${r.checks}</span></div>` : ''}</div>`,
      foot: html`<button class="btn primary" data-act="sheet-close">เรียบร้อย</button>` });
  }

  // ======================================================================
  // Approver: team today, entries, leave approvals, exceptions
  // ======================================================================
  /** Today's team (mode as in loadPay); after a change, called without a mode: always asked again. */
  function loadTeam(mode) {
    var bg = mode === 'bg';
    if (bg && S.team) return Promise.resolve(null);
    if (!S.team) {
      var m = lastPart('team');
      if (m) { S.team = m.data.team; S.entries = m.data.entries; if (!bg) render(); }
    } else if (mode === 'open' && freshPart('team')) return Promise.resolve(S.team);
    if (!bg) delete S.loadErr.team;
    return Promise.all([call('team', {}, actorAuth()), call('entries', {}, actorAuth())]).then(function (r) {
      S.team = r[0];
      S.cal = null;
      S.entries = r[1];
      partAt.team = Date.now();
      keepPart('team', { team: r[0], entries: r[1] });
      if (partShown('team')) softRender();
    }, function (e) { if (!bg) partFailed('team', e, !!S.team); });
  }
  function boardState(r) {
    if (r.state === 'in') {
      var d = r.day;
      var tone = d.late === 'ok' ? 'ok' : d.late === 'minor' ? 'warn' : 'bad';
      return html`<span class="pill ${tone}">${String(d.in).slice(0, 5)}${d.lateMin ? ' · สาย ' + dur(d.lateMin) : ''}</span><span class="tiny muted">${d.shiftType}${d.rain ? ' · ฝนตก' : ''}${d.probation ? ' · ทดลองงาน' : ''}</span>${r.review ? html`<span class="pill warn">รอตรวจ</span>` : ''}`;
    }
    if (r.state === 'leave') return html`<span class="pill gold">${r.leave}</span>`;
    if (r.state === 'absent') return html`<span class="pill bad">ขาดงาน</span>`;
    if (r.state === 'off') return html`<span class="pill">ร้านปิด</span>`;
    return html`<span class="pill">ยังไม่ลงเวลา</span>`;
  }
  /** Clock-ins waiting for the approver: why, with the screen's picture of who scanned. */
  function reviewCard(list) {
    if (!list.length) return '';
    // The approver's own items are the owner's, unless the owner lets the approver handle them (then the owner sees each one).
    var me = S.view !== 'owner' && S.home && S.home.me && S.team && !S.team.selfOk ? S.home.me.id : '';
    return html`<section class="card"><div class="card-h"><span class="eyebrow">รอตรวจ (${list.length})</span></div>
      <p class="small muted mt0">ดู <b>รูปจากจอ</b> ว่าเป็นคนนั้นจริงและยืนสแกนอยู่ในร้าน · ถูกต้อง กด <b>ผ่าน</b> · ไม่ถูก กด <b>แก้เวลา</b> ใส่เวลาหรือกะที่ถูก · ต้องตรวจครบก่อนอนุมัติเงินเดือน</p>
      <div class="list">${list.map(function (x) {
        var mine = x.empId === me;
        return html`<div class="item stacked" style="padding-left:0;padding-right:0">${avatar(empById(x.empId) || { name: x.name })}<div class="grow"><div class="t">${x.name}</div><div class="s">${thShort(x.date)} · ${x.in} น.${x.dist != null ? ' · ห่าง ' + distText(x.dist) : ''}</div>${x.why ? html`<div class="review-why">${x.why}</div>` : ''}</div>
          <div class="row wrapx" style="gap:6px;flex-basis:100%;justify-content:flex-end">${x.screenPhoto ? html`<button class="btn sm" data-act="photo" data-url="${x.screenPhoto}">${icon('image')} รูปจากจอ</button>` : ''}${x.photo ? html`<button class="btn sm" data-act="photo" data-url="${x.photo}">${icon('camera')} รูปจากมือถือ</button>` : ''}${mine ? html`<span class="small muted">รายการของคุณ — เจ้าของร้านตรวจ</span>` : html`<button class="btn sm" data-act="review-fix" data-id="${x.empId}" data-date="${x.date}" data-shift="${x.shift}" data-in="${x.in}">แก้เวลา</button><button class="btn sm primary" data-act="review-ok" data-id="${x.id}">ผ่าน</button>`}</div></div>`;
      })}</div></section>`;
  }
  function teamView() {
    var t = S.team;
    if (!t) return waiting('team', html`<div class="stack" aria-busy="true"><div class="skel" style="height:44px"></div><div class="skel" style="height:360px"></div><div class="skel" style="height:220px"></div></div>`);
    var b = t.board;
    var c = b.counts;
    var entries = (S.entries && S.entries.entries) || [];
    return html`<div class="stack">
      <div class="row between"><div><div class="hello" style="font-size:24px;margin:0">ทีมวันนี้</div><div class="muted small">${thDateLong(b.workDate)}</div></div><button class="icon-btn" data-act="reload-team" aria-label="รีเฟรช">${icon('refresh')}</button></div>
      ${rainBanner(t.rain, 'team')}
      ${reviewCard(t.reviews || [])}
      <div class="stats"><div class="stat"><b>${c.in}<small class="muted" style="font-size:13px">/${c.total - c.leave - (c.off || 0)}</small></b><span>ลงเวลาแล้ว</span></div><div class="stat ${c.late ? 'warn' : ''}"><b>${c.late}</b><span>สาย</span></div><div class="stat"><b>${c.leave + (c.off || 0)}</b><span>ลา · หยุด</span></div><div class="stat ${c.absent ? 'bad' : ''}"><b>${c.absent}</b><span>ขาด</span></div></div>
      <div class="row wrapx"><button class="btn sm" data-act="open-entry">${icon('plus')} OT / ขาด / เบิก</button><button class="btn sm" data-act="open-entry" data-type="อนุญาตเข้างานช้า">${icon('clock')} อนุญาตเข้าช้า</button><button class="btn sm" data-act="open-rain">${icon('rain')} ฝนตก</button><button class="btn sm" data-act="open-exceptions">${icon('cal')} เวลาพิเศษ</button><button class="btn sm" data-act="photo-wall">${icon('image')} รูปวันนี้</button></div>
      <section class="card flush">${b.rows.map(function (r) {
        return html`<div class="board-row">${avatar(r)}<div class="grow"><div class="t">${r.name}</div><div class="s">${r.dept}</div></div><div class="st">${boardState(r)}</div><button class="icon-btn" data-act="row-menu" data-id="${r.id}" aria-label="ตัวเลือกของ ${r.name}">${icon('more')}</button></div>`;
      })}</section>
      <h3 class="h3">ปฏิทินวันลาและวันหยุด</h3>
      ${calCard(S.cal || t.month)}
      <h3 class="h3">รายการเดือนนี้ (${entries.length})</h3>
      <section class="card flush">${entries.length ? html`<div class="list">${entries.slice(0, 40).map(function (x) { return entryRow(x); })}</div>` : html`<div class="empty">ยังไม่มีรายการ</div>`}</section>
    </div>`;
  }
  function entryRow(x, owner) {
    var amount = x.kind === 'permit' ? 'เข้า ' + x.time : x.kind === 'rain' ? (x.time || 'ทั้งวัน') : (x.kind === 'ot' && x.qty > 0 ? '+' : '') + (x.unit === 'บาท' ? money(x.qty) : hrs(x.qty)) + ' ' + x.unit;
    return html`<div class="item"><div class="grow"><div class="t">${x.name} · ${x.type}${x.review ? html` <span class="pill warn">เจ้าของร้านตรวจ</span>` : ''}</div><div class="s">${thDate(x.date)}${x.reason ? ' · ' + x.reason : ''}${x.noOt ? ' · ไม่ได้ OT' : ''} · โดย ${x.by}${x.evidence ? html`<br>${x.evidence}` : ''}</div></div><div class="r amt small">${amount}</div>${owner ? html`<button class="btn sm" data-act="rain-keep" data-id="${x.id}">ถูกต้อง</button><button class="icon-btn" data-act="rain-drop" data-id="${x.id}" aria-label="ลบ">${icon('trash')}</button>` : html`<button class="icon-btn" data-act="delete-entry" data-id="${x.id}" aria-label="ลบ">${icon('trash')}</button>`}</div>`;
  }
  function rowMenu(id) {
    var r = S.team.board.rows.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    var d = r.day;
    var info = d ? html`<div class="hint" style="margin-bottom:8px">${icon('clock')}<span>เข้างาน ${String(d.in).slice(0, 5)} · ${d.shiftName} เริ่ม ${d.startUsed}${d.lateMin ? ' · สาย ' + dur(d.lateMin) : ''}<br>${d.source}${d.rainInfo ? html`<br>${d.rainInfo}` : ''}</span></div>` : '';
    var pics = html`${d && d.screenPhoto ? html`<button class="menu-item" data-act="photo" data-url="${d.screenPhoto}">${icon('image')} รูปจากจอตอนสแกน</button>` : ''}${d && d.photo ? html`<button class="menu-item" data-act="photo" data-url="${d.photo}">${icon('camera')} รูปจากมือถือตอนลงเวลา</button>` : ''}`;
    // The approver's own day is the owner's to record or correct, where the owner keeps it that way.
    if (S.view !== 'owner' && S.home && S.home.me && S.home.me.id === id && !S.team.selfOk) {
      openSheet({ title: r.name, body: html`<div>${info}<div class="hint">${icon('info')}<span>รายการของคุณเอง (เวลา OT ลา) ให้เจ้าของร้านเป็นคนบันทึกหรือแก้</span></div>${pics}</div>` });
      return;
    }

  // ======================================================================
  // Payroll (approver and owner)

  // Each period's pay as this session last had it ('' = the one the server opens on).
  var payBy = {};
  /**
   * A period's pay, shown at once when this phone has it (from this session
   * or kept from before); today's numbers from the server. Approving and
   * paying wait until they are today's. mode 'open': a tab or month opened,
   * not asked again within a minute; 'bg': fetched ahead, shown only when
   * nothing else is.
   */
  function loadPay(key, mode) {
    var bg = mode === 'bg';
    var tag = key || (bg ? '' : S.payKey || '');
    if (bg && (S.pay || payBy[tag])) return Promise.resolve(null);
    if (!bg) {
      var have = S.pay && (!tag || S.pay.period.key === tag) ? { d: S.pay, at: S.payAt } : payBy[tag] || null;
      var kept = have ? null : lastPart('pay', tag);
      var show = have ? have.d : kept ? kept.data : null;
      var fresh = !!have && Date.now() - (have.at || 0) < FRESH_MS;
      var changed = show !== S.pay;
      S.pay = show;
      S.payAt = have ? have.at : 0;
      S.payKey = tag || (show ? show.period.key : null);
      S.partStale.pay = !!show && !fresh;
      delete S.loadErr.pay;
      if (changed) render();
      // Fetched a moment ago: as it is, and the month before is the one looked at next.
      if (mode === 'open' && fresh) { prefetchPay(shiftMonth(show.period.key, -1)); return Promise.resolve(show); }
    }
    var seq = S.paySeq = (S.paySeq || 0) + (bg ? 0 : 1);
    return call('payroll', { period: tag || null }, actorAuth()).then(function (d) {
      var got = { d: d, at: Date.now() };
      payBy[d.period.key] = got;
      if (!tag) { payBy[''] = got; keepPart('pay', d, ''); }
      if (bg ? S.pay : seq !== S.paySeq) return d;
      S.pay = d; S.payAt = got.at; S.payKey = d.period.key; S.partStale.pay = false;
      if (partShown('pay')) softRender();
      // The month before is the one looked at next.
      if (!bg) prefetchPay(shiftMonth(d.period.key, -1));
      return d;
    }, function (e) {
      if (bg || seq !== S.paySeq) return null;
      partFailed('pay', e, !!S.pay);
      return null;
    });
  }
  function prefetchPay(key) {
    if (payBy[key]) return;
    call('payroll', { period: key }, actorAuth()).then(function (d) { payBy[d.period.key] = { d: d, at: Date.now() }; }, function () {});
  }
  /** A change came back with a period's pay: it wins over any load still on its way. */
  function payChanged(d) {
    S.paySeq = (S.paySeq || 0) + 1;

    payBy[d.period.key] = { d: d, at: S.payAt };

  }

  /** Today's overview from the server; what is shown stays until it arrives. A lost connection never signs the owner out. */
  function loadOwner(quiet, fresh) {
    if (!S.owner) return Promise.resolve(null);
    if (S.ownerLoad && !fresh) return S.ownerLoad;
    var auth = ownerAuth();
    var seq = S.ownerSeq = (S.ownerSeq || 0) + 1;
    S.ownerLoad = call('owner', {}, auth, { fresh: !!fresh }).then(function (d) {
      if (seq !== S.ownerSeq) return null;
      S.ownerLoad = null;
      if (!S.owner || S.owner.pin !== auth.ownerPin) return null;
      S.ownerHome = d;
      S.ownerAt = Date.now();
      S.ownerErr = '';
      if (LS.get(KEY.owner)) remember('owner', d);
      if (S.view === 'owner') softRender();
      prefetchTabs();
      return d;
    }, function (e) {
      if (seq !== S.ownerSeq) return null;
      S.ownerLoad = null;
      if (e.code === 'AUTH') { logoutOwner(e.message); return null; }
      S.ownerErr = e.message;
      if (S.view === 'owner') render();
      if (!quiet && S.ownerHome) toast(e.message, 'bad');
      return null;
    });
    return S.ownerLoad;

          ? html`<p>เปิดแอป (หรือสแกน QR นี้ด้วยกล้องมือถือ)</p><p>ยืน<b>ข้างป้ายนี้</b> กด "ถ่ายรูปข้างป้าย · ลงเวลา"</p><p>ถ่ายให้เห็น<b>หน้า + ป้ายทั้งแผ่น</b></p>`
          : inApp
            ? html`<p>เปิดแอป กด <b>"สแกน QR ลงเวลา"</b></p><p>ส่องกล้องที่ป้ายนี้ ลงเวลาให้เอง</p><p class="small">ครั้งแรก: สแกนด้วยกล้องมือถือ แตะลิงก์ เพื่อเปิดแอป</p>`
            : html`<p>เปิดกล้องมือถือ สแกน QR นี้ แล้วแตะลิงก์</p><p>กด "ลงเวลาเข้างาน" (ต้องอยู่ในร้าน)</p>`}<div class="code">${o.qr.code}</div></div>
        <p class="small muted no-print" style="margin-top:12px">${poster
          ? 'พิมพ์ A4 (QR กว้างราว 15 ซม.) ติดระดับหน้าในร้าน ข้างที่ว่างที่ยืนถ่ายรูปได้ เช่น ทางเข้าหลังร้านหรือข้างตู้เก็บของ ห้ามติดหน้าร้านหรือที่มองเห็นจากลานจอดรถ · ใช้กระดาษด้าน ไม่เคลือบมัน ไม่ใส่กรอบกระจก (แสงสะท้อนทำให้อ่าน QR ในรูปไม่ได้) · ลิงก์หรือรูปป้ายที่เก็บไว้ใช้ลงเวลาไม่ได้ เพราะระบบต้องเห็นป้ายในรูปเซลฟี่ตอนนั้น'
          : 'ติดไว้ด้านในร้าน ตรงที่พนักงานเดินผ่านทุกวัน เช่น ทางเข้าหลังร้านหรือข้างตู้เก็บของ ห้ามติดหน้าร้านหรือที่มองเห็นจากลานจอดรถ · ' + (inApp ? 'ต้องส่องกล้องในแอปที่ป้ายจริง ลิงก์หรือรูป QR ที่เก็บไว้ใช้ลงเวลาไม่ได้ · ' : '') + 'ถ้าสงสัยว่ามีคนเก็บป้ายหรือพิมพ์ป้ายไป ให้กด "เปลี่ยน QR" แล้วพิมพ์ป้ายใหม่ (ระบบยังตรวจ GPS ว่าอยู่ในร้านทุกครั้ง)'}</p>`,
        foot: html`<button class="btn" data-act="rotate-qr">${icon('refresh')} เปลี่ยน QR</button>${HOOKS.noPrint ? '' : html`<button class="btn" data-act="print">${icon('print')} พิมพ์</button>`}<button class="btn primary" data-act="save-image" data-target="#qr-poster" data-name="seoulful-qr">${icon('image')} บันทึกรูป</button>` });
    }, function (e) { toast(e.message, 'bad'); });
  }

  // ======================================================================
  // Feedback: what staff run into or wish for, sent to the owner with
  // pictures or videos; the owner approves what Claude should fix or build
  // (Feedback.gs). Files go up in parts, each sent again by itself when its
  // answer is lost; the owner's page puts a video back together to play it.
  // ======================================================================
  var FB_KINDS = { bug: 'เจอปัญหา', idea: 'อยากได้เพิ่ม' };
  var FB_MINE_STATUS = { fresh: ['ส่งแล้ว · รอเจ้าของร้านดู', ''], approved: ['เจ้าของร้านอนุมัติ · กำลังทำ', 'gold'], built: ['ทำเสร็จแล้ว · รออัปเดตแอป', 'gold'], done: ['ใช้ได้แล้ว', 'ok'], declined: ['ยังไม่ทำตอนนี้', ''] };
  var FB_OWNER_STATUS = { fresh: ['ใหม่', 'warn'], approved: ['อนุมัติแล้ว · Claude กำลังทำ', 'gold'], built: ['Claude ทำแล้ว · รออัปเดตแอป', 'gold'], done: ['เสร็จแล้ว', 'ok'], declined: ['ยังไม่ทำ', ''] };
  var FB_PART = 4 * 1024 * 1024; // bytes of a file in one request
  var FB_VIDEO_MAX = 60 * 1024 * 1024;
  var FB_MAX_FILES = 4;
  var fb = null; // the message being written: {kind, text, files: [{file, t, url}]}
  var fbList = null; // the owner's list, as last fetched
  var fbMedia = {}; // 'id:file' → a picture or video put back together, as an object URL

  function fbFilesText(files) {
    var img = (files || []).filter(function (f) { return f.t !== 'video'; }).length;
    var vid = (files || []).length - img;
    return [img ? 'รูป ' + img : '', vid ? 'วิดีโอ ' + vid : ''].filter(String).join(' · ');
  }
  function fbThumb(f) {
    return f.thumb
      ? html`<span class="fb-thumb"><img src="${f.thumb}" alt="">${f.files.length && f.files[0].t === 'video' ? html`<i>${icon('play')}</i>` : ''}</span>`
      : html`<span class="fb-thumb">${icon(f.kind === 'bug' ? 'alert' : 'chat')}</span>`;
  }

  // ---- staff ----------------------------------------------------------------
  /** The invitation at the end of the home screen. */
  function feedbackInvite(count) {
    return html`<section class="card fb-invite"><span class="fb-ico">${icon('chat')}</span><div class="grow">
      <b>มีอะไรอยากบอกเจ้าของร้าน?</b><p class="small muted">เจอปัญหาในแอป หรืออยากได้อะไรเพิ่ม ส่งพร้อมรูป วิดีโอ หรือบันทึกหน้าจอได้</p>
      <div class="row wrapx" style="gap:8px"><button class="btn sm primary" data-act="fb-new">${icon('plus')} ส่งความคิดเห็น</button>${count ? html`<button class="btn sm" data-act="fb-mine">ของฉัน ${count} เรื่อง</button>` : ''}</div></div></section>`;
  }
  function openFeedbackForm(kind) {
    if (!fb) fb = { kind: kind || 'bug', text: '', files: [] };
    else if (kind) fb.kind = kind;
    openSheet({ title: 'ส่งความคิดเห็นถึงเจ้าของร้าน', body: feedbackFormBody(), foot: html`<button class="btn" data-act="sheet-close">ยกเลิก</button><button class="btn primary" data-act="fb-send">ส่ง</button>` });
    wireFeedbackForm();
  }
  function feedbackFormBody() {
    var bug = fb.kind === 'bug';
    return html`<div class="seg" role="radiogroup" aria-label="เรื่อง">
        <button aria-pressed="${bug}" data-act="fb-kind" data-kind="bug">เจอปัญหา</button>
        <button aria-pressed="${!bug}" data-act="fb-kind" data-kind="idea">อยากได้เพิ่ม</button></div>
      <label class="field" style="margin-top:14px"><span>${bug ? 'เกิดอะไรขึ้น กดตรงไหนแล้วเป็นอย่างไร' : 'อยากให้แอปทำอะไรได้ ช่วยงานอย่างไร'}</span>
        <textarea class="input" id="fb-text" maxlength="2000" placeholder="${bug ? 'เช่น กดแท็บสลิปแล้วหน้าค้าง ต้องปิดแอปแล้วเปิดใหม่' : 'เช่น อยากให้แอปเตือนก่อนเข้ากะ 30 นาที'}">${fb.text}</textarea></label>
      <div class="fb-files">${fb.files.map(function (f, i) {
        return html`<div class="fb-file">${f.t === 'video' ? html`<video src="${f.url}#t=0.1" muted playsinline preload="metadata"></video><span class="fb-badge">${icon('play')}</span>` : html`<img src="${f.url}" alt="">`}<button class="fb-x" data-act="fb-remove" data-i="${i}" aria-label="เอาไฟล์นี้ออก">${icon('x')}</button></div>`;
      })}${fb.files.length < FB_MAX_FILES ? html`<label class="fb-add">${icon('image')}<span>รูป / วิดีโอ</span><input type="file" id="fb-input" accept="image/*,video/*" multiple></label>` : ''}</div>
      <p class="tiny muted" style="margin:10px 0 0">${bug ? html`อัดวิดีโอหน้าจอได้: ปัดลงจากมุมขวาบน กดปุ่มบันทึกหน้าจอ ทำให้เห็นปัญหา แล้วแนบวิดีโอจากคลังรูปภาพ · ` : ''}เจ้าของร้านเห็นชื่อของคุณ และคุณดูได้ว่าเรื่องที่ส่งไปถึงไหนแล้ว</p>`;
  }
  function wireFeedbackForm() {
    var t = $('#fb-text');
    if (t) t.oninput = function () { fb.text = t.value; };
    var input = $('#fb-input');
    if (input) input.onchange = function () { addFeedbackFiles(input.files); };
  }
  function refreshFeedbackForm() {
    setSheetBody(feedbackFormBody());
    wireFeedbackForm();
  }
  /** A file's type as the server takes it (some phones leave it empty). */
  function fbType(file) {
    var t = String(file.type || '').toLowerCase();
    if (t) return t;
    var ext = (String(file.name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
    return { mov: 'video/quicktime', mp4: 'video/mp4', m4v: 'video/x-m4v', webm: 'video/webm', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic' }[ext.toLowerCase()] || '';
  }
  function addFeedbackFiles(list) {
    var added = 0;
    Array.prototype.forEach.call(list || [], function (file) {
      if (fb.files.length >= FB_MAX_FILES) { toast('แนบได้สูงสุด ' + FB_MAX_FILES + ' ไฟล์', 'bad'); return; }
      var type = fbType(file);
      var t = /^video\//.test(type) ? 'video' : /^image\//.test(type) ? 'image' : '';
      if (!t) { toast('แนบได้เฉพาะรูปหรือวิดีโอ', 'bad'); return; }
      if (t === 'video' && file.size > FB_VIDEO_MAX) { toast('วิดีโอยาวเกินไป (เกิน 60 MB) ตัดให้สั้นลงแล้วแนบใหม่', 'bad'); return; }
      fb.files.push({ file: file, t: t, type: type, url: URL.createObjectURL(file) });
      added++;
    });
    if (added) refreshFeedbackForm();
  }
  function canvasBlob(cv, quality) {
    return new Promise(function (resolve) {
      if (cv.toBlob) cv.toBlob(function (b) { resolve(b); }, 'image/jpeg', quality);
      else resolve(null);
    }).then(function (b) {
      if (b) return b;
      var bin = atob(cv.toDataURL('image/jpeg', quality).split(',')[1]);
      var a = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return new Blob([a], { type: 'image/jpeg' });
    });
  }
  /** A still of a video, a moment in, or null when the phone cannot draw it. */
  function videoStill(url) {
    return new Promise(function (resolve) {
      var v = document.createElement('video');
      var done = function (cv) { clearTimeout(t); v.removeAttribute('src'); resolve(cv); };
      var t = setTimeout(function () { done(null); }, 4000);
      v.muted = true;
      v.playsInline = true;
      v.preload = 'auto';
      v.onloadeddata = function () { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { done(null); } };
      v.onseeked = function () { try { done(drawScaled(v, v.videoWidth, v.videoHeight, 480)); } catch (e) { done(null); } };
      v.onerror = function () { done(null); };
      v.src = url;
    });
  }
  /** Each file ready to send (a picture made smaller, as JPEG), and a small picture of the first. */
  function prepareFeedbackFiles(files) {
    var thumb = '';
    return files.reduce(function (p, f, i) {
      return p.then(function (out) {
        var ready = f.t === 'image'
          ? fileImage(f.file).then(function (r) {
            var cv = drawScaled(r.img, r.img.naturalWidth, r.img.naturalHeight, 1600);
            if (!i) thumb = drawScaled(cv, cv.width, cv.height, 160).toDataURL('image/jpeg', 0.62);
            r.done();
            return canvasBlob(cv, 0.84).then(function (b) { return { blob: b, type: 'image/jpeg' }; });
          })
          : (i ? Promise.resolve(null) : videoStill(f.url)).then(function (cv) {
            if (cv && !i) thumb = drawScaled(cv, cv.width, cv.height, 160).toDataURL('image/jpeg', 0.62);
            return { blob: f.file, type: f.type };
          });
        return ready.then(function (x) { out.push(x); return out; });
      });
    }, Promise.resolve([])).then(function (out) { return { files: out, thumb: thumb.length < 24000 ? thumb : '' }; });
  }
  function blobBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { reject(new Error('อ่านไฟล์ไม่ได้ กรุณาเลือกใหม่')); };
      r.readAsDataURL(blob);
    });
  }
  /** A change the server keeps once however often it comes: sent again when its answer is lost. */
  function sendAgainOnLoss(fn) {
    var tries = 0;
    var go = function () {
      return fn().catch(function (e) {
        if (!(e.network || e.transient) || tries >= 3) throw e;
        tries++;
        return later(tries * 1500).then(whenOnline).then(go);
      });
    };
    return go();
  }
  function randomDraft() {
    var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
    var out = '';
    var bytes = window.crypto && crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(14)) : null;
    for (var i = 0; i < 14; i++) out += abc[(bytes ? bytes[i] : Math.floor(Math.random() * 256)) % abc.length];
    return out;
  }
  function sendFeedback() {
    var box = $('#fb-text');
    if (box) fb.text = box.value;
    var text = String(fb.text || '').trim();
    if (text.length < 3 && !fb.files.length) { toast('เล่าให้ฟังสักนิดว่าเจออะไร หรืออยากได้อะไร', 'bad'); if (box) box.focus(); return; }
    var mine = fb;
    var draft = randomDraft();
    var auth = staffAuth();
    var total = 1;
    var sent = 0;
    var bar = function () { var b = $('#fb-bar'); if (b) b.style.width = Math.max(4, Math.round((sent / total) * 100)) + '%'; };
    openSheet({ title: 'ส่งความคิดเห็นถึงเจ้าของร้าน', saving: true, body: html`<div class="result-wait" aria-busy="true"><div class="mark">${icon('chat')}</div><h2>กำลังส่ง…</h2>${mine.files.length ? html`<p class="first">${fbFilesText(mine.files.map(function (f) { return { t: f.t }; }))}</p><div class="bar fb-bar"><i id="fb-bar" style="width:4%"></i></div><p class="small muted">ไฟล์ใหญ่ใช้เวลาสักครู่ เปิดหน้านี้ไว้จนกว่าจะส่งเสร็จ</p>` : ''}</div>` });
    prepareFeedbackFiles(mine.files).then(function (ready) {
      total = ready.files.reduce(function (n, f) { return n + f.blob.size; }, 0) || 1;
      var files = [];
      return ready.files.reduce(function (p, f, i) {
        return p.then(function () {
          var parts = Math.max(1, Math.ceil(f.blob.size / FB_PART));
          var ids = [];
          var one = function (k) {
            if (k >= parts) { files.push({ type: f.type, size: f.blob.size, parts: ids }); return Promise.resolve(); }
            var chunk = f.blob.slice(k * FB_PART, Math.min(f.blob.size, (k + 1) * FB_PART));
            return blobBase64(chunk).then(function (b64) {
              return sendAgainOnLoss(function () { return call('feedbackUpload', { draft: draft, file: i, of: parts, part: k, type: f.type, data: b64 }, auth); });
            }).then(function (d) { ids.push(d.id); sent += chunk.size; bar(); return one(k + 1); });
          };
          return one(0);
        });
      }, Promise.resolve()).then(function () {
        return sendAgainOnLoss(function () { return call('feedbackSend', { draft: draft, kind: mine.kind, text: text, files: files, thumb: ready.thumb }, auth); });
      });
    }).then(function (d) {
      mine.files.forEach(function (f) { URL.revokeObjectURL(f.url); });
      if (fb === mine) fb = null;
      S.fbMine = d.mine;
      if (S.home) { S.home.feedback = d.mine.length; remember('home', S.home, homeTag(S.staff.empId, S.home)); if (S.view === 'staff') softRender(); }
      openSheet({ title: 'ส่งความคิดเห็นถึงเจ้าของร้าน', body: html`<div class="result ok"><div class="mark">${icon('check')}</div><h2>ส่งถึงเจ้าของร้านแล้ว</h2><p class="first">ขอบคุณที่ช่วยให้แอปดีขึ้น</p><p>ดูได้ว่าเรื่องนี้ถึงไหนแล้วที่ "ความคิดเห็นของฉัน"</p></div>`,
        foot: html`<button class="btn" data-act="fb-mine">ความคิดเห็นของฉัน</button><button class="btn primary" data-act="sheet-close">เรียบร้อย</button>` });
    }, function (e) {
      openFeedbackForm();
      toast(e.network ? 'เน็ตไม่ดี ส่งไม่สำเร็จ — กด "ส่ง" อีกครั้งได้เลย ไม่ซ้ำกัน' : e.message, 'bad');
    });
  }
  function myFeedbackBody() {
    var list = S.fbMine;
    if (!list) return html`<div class="stack" aria-busy="true"><div class="skel" style="height:72px"></div><div class="skel" style="height:72px"></div></div>`;
    if (!list.length) return html`<div class="empty">ยังไม่เคยส่งความคิดเห็น</div>`;
    return html`<div class="list">${list.map(function (f) {
      var st = FB_MINE_STATUS[f.status] || FB_MINE_STATUS.fresh;
      return html`<div class="item fb-item">${fbThumb(f)}<div class="grow"><div class="t">${FB_KINDS[f.kind]} <span class="muted small">· ${whenAt(f.at)}</span></div><div class="s fb-text">${f.text || fbFilesText(f.files)}</div>
        <span class="pill ${st[1]}" style="margin-top:6px">${f.status === 'done' ? icon('check') : ''}${st[0]}</span>${f.note ? html`<div class="s fb-note">เจ้าของร้าน: ${f.note}</div>` : ''}</div></div>`;
    })}</div>`;
  }
  function openMyFeedback() {
    openSheet({ title: 'ความคิดเห็นของฉัน', body: myFeedbackBody(), foot: html`<button class="btn" data-act="sheet-close">ปิด</button><button class="btn primary" data-act="fb-new">${icon('plus')} ส่งเรื่องใหม่</button>` });
    call('feedbackMine', {}, staffAuth()).then(function (d) {
      S.fbMine = d.mine;
      if (sheetState && sheetState.title === 'ความคิดเห็นของฉัน') setSheetBody(myFeedbackBody());
    }, function (e) { if (!S.fbMine) toast(e.message, 'bad'); });
  }

  // ---- owner ----------------------------------------------------------------
  /** On the owner's overview, when anyone has sent something. */
  function feedbackCard(f) {
    if (!f || !f.total) return '';
    var last = (f.latest || [])[0];
    return html`<section class="card flush"><button class="item fb-card" data-act="fb-inbox"><span class="fb-ico">${icon('chat')}</span><div class="grow"><div class="t">ความคิดเห็นจากพนักงาน</div>
      <div class="s fb-text">${last ? last.name + ': ' + (last.text || fbFilesText(last.files)) : ''}</div></div>${f.fresh ? html`<span class="pill warn">ใหม่ ${f.fresh}</span>` : ''}${icon('right')}</button></section>`;
  }
  function fbFind(id) { return (fbList ? fbList.items : []).filter(function (x) { return x.id === id; })[0] || null; }
  function loadFeedbackList() {
    return call('feedbackList', {}, ownerAuth()).then(function (d) {
      fbList = d;
      var fresh = d.items.filter(function (x) { return x.status === 'fresh'; }).length;
      if (S.ownerHome && S.ownerHome.feedback) { S.ownerHome.feedback.fresh = fresh; S.ownerHome.feedback.total = d.items.length; }
      return d;
    });
  }
  function inboxBody() {
    if (!fbList) return html`<div class="stack" aria-busy="true"><div class="skel" style="height:76px"></div><div class="skel" style="height:76px"></div><div class="skel" style="height:76px"></div></div>`;
    var items = fbList.items;
    if (!items.length) return html`<div class="empty">ยังไม่มีความคิดเห็นจากพนักงาน</div>`;
    var groups = [
      ['ใหม่', items.filter(function (x) { return x.status === 'fresh'; })],
      ['ให้ Claude ทำ', items.filter(function (x) { return x.status === 'approved' || x.status === 'built'; })],
      ['ที่ผ่านมา', items.filter(function (x) { return x.status === 'done' || x.status === 'declined'; })],

  function fbBytes(b64) {

  /** An attached file, its parts fetched one after another and put back together. */
  function fbFetchFile(f, i, onPart) {
    var key = f.id + ':' + i;

    var file = f.files[i];
    var chunks = [];
    var next = function (k) {
      if (k >= file.parts) {

        return Promise.resolve(fbMedia[key]);
      }
      return call('feedbackFile', { id: f.id, file: i, part: k }, ownerAuth()).then(function (d) {
        chunks.push(fbBytes(d.data));

        return next(k + 1);

    };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && el.getAttribute('href') && !/^#/.test(el.getAttribute('href'))) return;
    ev.preventDefault();
    noteLens(el);
    fn(el, ev);
    glideLenses();
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'cam-env' || el.id === 'cam-user') { onCameraFile(el); return; }
    if (el.dataset.change === 'lv-type') {
      var t = (B.leaveTypes || []).filter(function (x) { return x.type === el.value; })[0];
      var n = $('#lv-note'); if (n) n.textContent = leaveTypeNote(t);
    }
    if (el.dataset.change === 'en-type') {
      var o = { type: el.value, emp: $('#en-emp').value, date: $('#en-date').value, reason: $('#en-reason').value };
      setSheetBody(entryForm(o));
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.view === 'kiosk') {
      // The screen woke up: timers slept with it, so show a fresh QR now, and bring the camera back.
      keepAwake();
      if (S.k.step === 'names') drawLiveQr();
      if (camWanted()) { startScreenCam(); attachMirror(); }
      pingSoon(500);
      return;
    }
    if (document.visibilityState === 'visible' && S.bootErr) { retryBoot(); return; }
    // Back in the app after a while: refresh today (rain, approvals) quietly.
    if (document.visibilityState !== 'visible' || sheetState) return;
    if (S.view === 'staff' && S.staff && S.home && Date.now() - (S.homeAt || 0) > 120000) loadHome(true);
    if (S.view === 'owner' && S.owner && S.ownerHome && S.ownerTab === 'overview' && Date.now() - (S.ownerAt || 0) > 120000) loadOwner(true);
  });
  window.addEventListener('focus', function () {
    // The camera app closed without a picture: release the pending promise.
    setTimeout(function () {
      if (pendingCamera && !($('#cam-env').files || []).length && !($('#cam-user').files || []).length) {
        var p = pendingCamera; pendingCamera = null; p.reject(new Error('ยังไม่ได้ถ่ายรูป'));
      }
    }, 1200);
  });
  document.addEventListener('keydown', function (ev) {
    var pinView = S.view === 'pin' || S.view === 'ownerLogin' || (S.view === 'kiosk' && S.k.step === 'pin');
    if (!pinView || sheetState) return;
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('del');
    else if (ev.key === 'Enter') pinKey('ok');
  });
  // The top bar turns to glass once the page moves under it. Scrolling down to
  // read, the tab bar tucks its labels away; it shows them again on the way back
  // up, near the top, and at the end of the page.
  var barsMin = false;
  var scrollY0 = 0;
  var scrollQueued = false;
  function syncBars() {
    var bar = $('.topbar');
    if (bar) bar.classList.toggle('scrolled', window.scrollY > 4);
    var tabs = $('.tabbar');
    if (tabs) tabs.classList.toggle('min', !!barsMin);
  }
  window.addEventListener('scroll', function () {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(function () {
      scrollQueued = false;
      var y = Math.max(0, window.scrollY);
      var dy = y - scrollY0;
      var edge = y < 60 || y + window.innerHeight >= document.documentElement.scrollHeight - 24;
      if (edge) barsMin = false;
      else if (dy > 8) barsMin = true;
      else if (dy < -8) barsMin = false;
      if (edge || Math.abs(dy) > 8) scrollY0 = y;
      syncBars();
    });
  }, { passive: true });
  // iPhone shows a pressed look (:active) only when the page listens for touches.
  document.addEventListener('touchstart', function () {}, { passive: true });

  // Clock displays tick without re-rendering the page.
  function tick() {
    var n = now();
    var p = parts(n);
    document.querySelectorAll('[data-clock]').forEach(function (el) {
      if (el.dataset.clock === 'big') el.innerHTML = pad(p.hh) + ':' + pad(p.mi) + '<small>' + pad(p.ss) + '</small>';
      else if (el.dataset.clock === 'hms') el.textContent = pad(p.hh) + ':' + pad(p.mi) + ':' + pad(p.ss);
      else if (el.dataset.clock === 'day') el.textContent = thDateLong(ymdOf(n));
      else el.textContent = thDateLong(ymdOf(n)) + (el.dataset.clock === 'date' && S.view !== 'kiosk' ? ' · ' + pad(p.hh) + ':' + pad(p.mi) + ' น.' : '');
    });
  }
  setInterval(tick, 1000);

  // ======================================================================
  // Start
  // ======================================================================
  function start() {
    if (B.error) { S.view = 'error'; render(); return; }
    if (B.siteUrl && !S.stay) { S.view = 'moved'; render(); return; }
    if (S.kiosk && S.kiosk.token) {
      // The screen as it last was, at once (or its outline); its data follows.
      var lastK = recall('kboot', S.kiosk.id || '');
      if (lastK) { B = Object.assign(B, lastK.data); kioskDone(lastK.data); }
      S.view = 'kiosk';
      kioskReset();
      kioskBoot();
      return;
    }
    // Signed in on this phone: straight to the screen as last seen (or its
    // outline), while today's is fetched.
    if (B.page === 'owner' || (S.owner && !S.staff)) {
      if (!S.owner) { S.view = 'ownerLogin'; render(); return; }
      var lastOwner = recall('owner');
      if (lastOwner && !S.ownerHome) { S.ownerHome = lastOwner.data; S.ownerAt = lastOwner.at; }
      S.view = 'owner';
      render();
      loadOwner(true);
      return;
    }
    if (S.staff) {
      var lastHome = recall('home', homeTag(S.staff.empId));
      if (lastHome && !S.home) { applyHome(lastHome.data); S.homeAt = lastHome.at; }
      S.view = 'staff';
      render();
      loadHome(true);
      return;
    }
    S.view = 'start';
    render();
  }

  /**
   * The page's first step. On the shop's site the boot data comes from the
   * server (Google's page has it written in), after taking in what Google's
   * page handed over.
   */
  function boot() {
    if (!SITE) { start(); return; }
    takeHandoff();
    // The shop's screen asks for its own (start).
    if (S.kiosk && S.kiosk.token) { start(); return; }
    var q = new URLSearchParams(location.search);
    var page = String(SITE.page || q.get('page') || '').toLowerCase();
    var scan = q.get('in') || q.get('qr') || '';
    // Opened by scanning the shop's QR: the code counts at once (the server checks it at the clock-in).
    var code = LIVE_QR_RE.test(scan) ? scan : /^[A-Za-z0-9]{4,16}$/.test(scan) ? scan.toUpperCase() : '';
    if (code && !S.scanCode) S.scanCode = code;
    var fresh = call('boot', { page: page, scan: scan, v: CODE_VERSION });
    // What this phone kept from last time shows now: names, shifts and rules
    // rarely change, and the fresh copy follows in a moment. The person's own
    // screen is asked for at the same time (start), not after.
    var last = recall('boot', page);
    if (last) B = Object.assign(B, last.data);
    B.page = page;
    start();
    fresh.then(function (b) {
      B = Object.assign(B, b);
      S.bootErr = '';
      var keep = Object.assign({}, b);
      delete keep.scan; delete keep.serverNow;
      remember('boot', keep, page);
      if (B.scan) S.scanCode = B.scan;
      bootTries = 0;
      softRender();
    }, function (e) {
      // What this phone kept will do until the next open.
      if (!last) bootFailed(e);
    });
  }
  // A first load that failed is tried again by itself: soon, then less often,
  // and at once when the phone is back online or the app is opened again.
  var bootTries = 0;
  var bootTimer = 0;
  function bootFailed(e) {
    // The server's own answer (the sheet is not set up): say it, nothing to retry.
    if (!e.network && !e.transient) { B.error = e.message; S.view = 'error'; render(); return; }
    S.bootErr = e.message;
    if (S.view === 'start') S.view = 'offline';
    render();
    clearTimeout(bootTimer);
    bootTimer = setTimeout(retryBoot, Math.min(30000, 3000 * Math.pow(2, bootTries++)));
  }
  function retryBoot() {
    clearTimeout(bootTimer);
    if (!S.bootErr || document.visibilityState === 'hidden') return;
    S.bootErr = '';
    if (S.view === 'offline') S.view = 'start';
    boot();
  }
  window.addEventListener('online', retryBoot);

  // ---- the move from Google's page to the shop's site ----------------------
  // Each has its own memory in the phone, so the button carries this phone's
  // login, shop screen and device id across, in the address's #fragment
  // (never sent to a server), once.
  var HANDOFF = [['staff', KEY.staff], ['owner', KEY.owner], ['kiosk', KEY.kiosk], ['device', KEY.device]];
  function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64url(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))); }
  function movedUrl() {
    var owner = !S.kiosk && (B.page === 'owner' || (!!S.owner && !S.staff));
    var url = B.siteUrl + (owner ? 'owner.html' : '');
    if (B.scan) url += (B.scan.indexOf('.') >= 0 ? '?in=' : '?qr=') + encodeURIComponent(B.scan);
    var carry = {};
    HANDOFF.forEach(function (h) { var v = LS.get(h[1]); if (v) carry[h[0]] = v; });
    return Object.keys(carry).length ? url + '#move=' + b64url(JSON.stringify(carry)) : url;
  }
  function takeHandoff() {
    var m = /[#&]move=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* the address keeps it */ }
    var got = null;
    try { got = JSON.parse(unb64url(m[1])); } catch (e) { return; }
    if (!got || typeof got !== 'object') return;
    // What this site already remembers wins.
    HANDOFF.forEach(function (h) { if (got[h[0]] && !LS.get(h[1])) LS.set(h[1], got[h[0]]); });
    S.staff = LS.get(KEY.staff);
    S.owner = LS.get(KEY.owner);
    S.kiosk = LS.get(KEY.kiosk);
  }
  VIEWS.moved = function () {
    return html`<div class="wrap page"><div class="start-head">${brand(true)}</div>
      <div class="card pad-lg center stack"><h2 class="title">แอปย้ายไปที่ใหม่แล้ว</h2>
        <p class="muted mt0">ที่ใหม่ไม่มีแถบฟ้าของ Google และกล้องสแกน QR เปิดได้ · ${S.kiosk ? 'จอนี้ย้ายไปพร้อมการตั้งค่า ไม่ต้องตั้งใหม่' : S.staff || S.owner ? 'แอปจำชื่อและ PIN ไปให้' : 'ครั้งแรกเลือกชื่อแล้วใส่ PIN'}</p>
        <a class="btn primary block" href="${movedUrl()}" target="_top">ไปที่แอปใหม่</a>
        ${S.kiosk ? '' : html`<p class="small muted">แล้วเพิ่มหน้าใหม่ลงหน้าจอโฮม (iPhone: Safari › ปุ่มแชร์ › เพิ่มไปยังหน้าจอโฮม) ไอคอนเดิมลบได้</p>`}
        <button class="btn ghost sm" data-act="stay-old">ใช้หน้าเดิมชั่วคราว</button></div></div>`;
  };

  // Hooks for the demo page and for tests.
  window.SeoulfulApp = {
    reset: function () { closeSheet(); stopCamera(); LS.del(KEY.staff); LS.del(KEY.owner); LS.del(KEY.kiosk); forget('home'); forget('owner'); forget('parts'); dropSession(); S.staff = null; S.owner = null; S.kiosk = null; S.home = null; S.homeErr = ''; S.ownerHome = null; S.ownerErr = ''; S.pay = null; S.team = null; S.leaves = null; S.employees = null; S.tab = 'home'; S.sub = null; S.ownerTab = 'overview'; S.k.done = {}; S.view = 'start'; render(); },
    // Another phone picked up (the demo's roles): opened as it was left, from what it keeps.
    resume: function () {
      closeSheet(); stopCamera();
      S.staff = LS.get(KEY.staff); S.owner = LS.get(KEY.owner); S.kiosk = LS.get(KEY.kiosk);
      S.home = null; S.homeErr = ''; S.ownerHome = null; S.ownerErr = ''; S.pay = null; S.team = null; S.leaves = null; S.employees = null; S.month = null; S.cal = null;
      S.homeLoad = null; S.ownerLoad = null; S.login = null; S.pin = ''; S.pinErr = ''; S.shift = null;
      S.tab = 'home'; S.sub = null; S.ownerTab = 'overview'; S.k.done = {};
      dropSession();
      start();
    },
    // The demo's other phones, in use already: signed in, with today's screens
    // kept, as their owners left them. `ask` answers as the server would, at once.
    keepSignedIn: function (p, ask) {
      if (p.kiosk) {
        var kb = ask('boot', { kiosk: p.kiosk.token, v: CODE_VERSION });
        delete kb.scan; delete kb.serverNow;
        LS.set(KEY.kiosk, p.kiosk);
        remember('kboot', kb, p.kiosk.id);
        return;
      }
      var who = p.owner ? 'owner' : p.staff.empId;
      var auth = p.owner ? { ownerPin: p.owner.pin } : { empId: who, pin: p.staff.pin };
      if (p.owner) {
        LS.set(KEY.owner, p.owner);
        remember('owner', ask('owner', {}, auth));
      } else {
        var h = ask('home', {}, auth);
        LS.set(KEY.staff, { empId: who, pin: p.staff.pin, name: ownName(h.me) });
        remember('home', h, homeTag(who, h));
        if (h.me.role !== 'approver') return;
      }
      keepPart('pay', ask('payroll', { period: null }, auth), '', who);
      keepPart('team', { team: ask('team', {}, auth), entries: ask('entries', {}, auth) }, '', who);
      keepPart('leaves', ask('leaves', {}, auth), '', who);
      if (p.owner) keepPart('employees', ask('employees', {}, auth), '', who);
    },
    kiosk: function (token, id, name) { S.kiosk = { token: token, id: id, name: name }; LS.set(KEY.kiosk, S.kiosk); start(); },
    // As if the page was opened by scanning the shop's QR poster with the phone camera.
    scan: function (code) { S.scanCode = code; if (S.view === 'staff') { S.tab = 'home'; S.sub = null; render(); } },
    // Forget the last position and look again (the demo moves the phone).
    relocate: function () { S.geo = null; if (S.view === 'staff') { warmGps(); render(); } },
    // Load today again (the demo changes the weather).
    refresh: function () {
      if (S.view === 'staff') { loadHome(true); if (S.tab === 'team') loadTeam(); }
      else if (S.view === 'kiosk') kioskRefresh();
    },
    // Read the shop's QR out of a picture, as a selfie would be read (browser checks).
    findQrInPhoto: findQrInPhoto,
    state: S,
  };
  boot();
})();
</script>
