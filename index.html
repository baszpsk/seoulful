<style>
/*
 * Liquid glass. The content sits on soft warm light; what floats over it (the
 * top bar, the tab bar, sheets, messages) is glass that blurs what passes
 * under it, with a bright rim where light catches its edge. Only those few
 * fixed layers blur: cards are milky glass over the still light, which costs
 * the phone nothing while scrolling.
 */
:root {
  --bg: #f2eee7;
  --amb-1: rgba(226, 188, 122, .40);
  --amb-2: rgba(236, 190, 172, .30);
  --amb-3: rgba(178, 198, 172, .28);
  --surface: #fffdf9;
  --surface-2: rgba(255, 255, 255, .56);
  --card: rgba(255, 255, 255, .70);
  --inset: rgba(96, 72, 40, .075);
  --ink: #171412;
  --ink-2: #4a443e;
  --muted: #80776d;
  --line: rgba(92, 68, 36, .12);
  --line-strong: rgba(92, 68, 36, .22);
  --gold: #a07a3f;
  --gold-ink: #87652f;
  --gold-soft: rgba(196, 150, 80, .16);
  --accent: #171412;
  --accent-ink: #ffffff;
  --ok: #2d6a4d;
  --ok-soft: rgba(45, 125, 90, .12);
  --warn: #9d6116;
  --warn-soft: rgba(206, 140, 50, .16);
  --bad: #ad2f28;
  --bad-soft: rgba(200, 60, 50, .12);
  --rain: #365f8c;
  --rain-soft: rgba(70, 120, 180, .13);
  --scrim: rgba(28, 22, 16, .32);
  --glass: rgba(251, 248, 243, .74);
  --glass-strong: rgba(251, 249, 245, .95);
  --glass-blur: blur(14px) saturate(1.8);
  --rim-hi: rgba(255, 255, 255, .92);
  --rim: rgba(255, 255, 255, .45);
  --lens: rgba(255, 255, 255, .88);
  --btn: rgba(255, 255, 255, .74);
  --btn-line: rgba(92, 68, 36, .13);
  --key: rgba(255, 255, 255, .62);
  --key-on: rgba(255, 255, 255, .98);
  --shadow-1: 0 1px 2px rgba(70, 50, 24, .07), 0 1px 1px rgba(70, 50, 24, .03);
  --shadow-2: 0 24px 60px -12px rgba(50, 34, 14, .32), 0 4px 14px rgba(50, 34, 14, .08);
  --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .92), inset 0 0 0 1px rgba(255, 255, 255, .45), 0 0 0 .5px rgba(92, 68, 36, .08), 0 1px 2px rgba(92, 68, 36, .05), 0 14px 30px -16px rgba(92, 68, 36, .22);
  --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, .92), inset 0 0 0 1px rgba(255, 255, 255, .45), 0 0 0 .5px rgba(92, 68, 36, .10), 0 12px 32px -10px rgba(60, 42, 20, .28), 0 2px 6px rgba(60, 42, 20, .08);
  --hero-bg: radial-gradient(120% 110% at 0% 0%, rgba(212, 170, 104, .30), transparent 55%), linear-gradient(160deg, #29221c, #120f0c);
  --primary-bg: linear-gradient(180deg, #2e2822, #151210);
  --primary-ink: #fffaf2;
  --primary-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .04), 0 8px 18px -8px rgba(23, 20, 18, .55), 0 1px 2px rgba(23, 20, 18, .2);
  --hero-ink: #f6f1e9;
  --hero-muted: rgba(246, 241, 233, .62);
  --hero-rim: inset 0 1px 0 rgba(255, 232, 190, .18), inset 0 0 0 1px rgba(255, 232, 190, .08), 0 20px 40px -20px rgba(30, 20, 8, .6);
  --r-xl: 30px;
  --r-lg: 24px;
  --r-md: 16px;
  --r-sm: 12px;
  /* Springs: a little overshoot for what moves, none for what slides in. */
  --spring: cubic-bezier(.3, 1.3, .5, 1);
  --spring-soft: cubic-bezier(.22, 1, .36, 1);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --font: "Anuphan", "Noto Sans Thai", "Sarabun", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --serif: "Playfair Display", "Noto Serif", Georgia, serif;
  --ko: "Noto Serif KR", serif;
  --wrap: 560px;
  color-scheme: light;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, 0.011 1.7%, 0.042 3.3%, 0.088 5%, 0.209 8.3%, 0.554 16.7%, 0.675 20%, 0.778 23.3%, 0.861 26.7%, 0.925 30%, 0.989 35%, 1.023 40%, 1.035 53.3%, 1);
    --spring-soft: linear(0, 0.009 1.7%, 0.032 3.3%, 0.066 5%, 0.156 8.3%, 0.472 18.3%, 0.609 23.3%, 0.72 28.3%, 0.83 35%, 0.916 43.3%, 0.983 58.3%, 1);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --gold: #d2ac6b; --gold-ink: #e2c088; --gold-soft: rgba(210, 172, 107, .16); --accent: #f2ede6; --accent-ink: #171412;
    --ok: #7fc9a0; --ok-soft: rgba(127, 201, 160, .13); --warn: #e6b464; --warn-soft: rgba(230, 180, 100, .14); --bad: #f08c82; --bad-soft: rgba(240, 140, 130, .13);
    --rain: #8db7e6; --rain-soft: rgba(141, 183, 230, .13); --scrim: rgba(0, 0, 0, .5);
    --glass: rgba(36, 32, 28, .72); --glass-strong: rgba(29, 26, 23, .95); --rim-hi: rgba(255, 255, 255, .16); --rim: rgba(255, 255, 255, .07); --lens: rgba(255, 255, 255, .13);
    --btn: rgba(255, 248, 238, .08); --btn-line: rgba(255, 248, 238, .10); --key: rgba(255, 248, 238, .09); --key-on: rgba(255, 248, 238, .30);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 24px 60px -12px rgba(0, 0, 0, .7), 0 4px 14px rgba(0, 0, 0, .4);
    --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px rgba(255, 255, 255, .055), 0 1px 2px rgba(0, 0, 0, .35), 0 14px 30px -16px rgba(0, 0, 0, .7);
    --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .07), 0 12px 32px -10px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4);
    --hero-bg: radial-gradient(120% 110% at 0% 0%, rgba(210, 172, 107, .26), transparent 60%), linear-gradient(160deg, rgba(210, 172, 107, .12), rgba(210, 172, 107, .03));
    --hero-rim: inset 0 1px 0 rgba(236, 206, 150, .22), inset 0 0 0 1px rgba(236, 206, 150, .12), 0 20px 40px -20px rgba(0, 0, 0, .7);
    --primary-bg: linear-gradient(180deg, #fbf6ee, #e2d9cb); --primary-ink: #171412; --primary-shadow: inset 0 1px 0 #fff, 0 8px 20px -8px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0d0b; --amb-1: rgba(200, 150, 80, .20); --amb-2: rgba(160, 86, 70, .15); --amb-3: rgba(50, 110, 104, .14);
  --surface: #1d1a17; --surface-2: rgba(255, 248, 238, .05); --card: rgba(255, 248, 238, .055); --inset: rgba(255, 248, 238, .075);
  --ink: #f2ede6; --ink-2: #cfc6ba; --muted: #9b9185; --line: rgba(255, 248, 238, .09); --line-strong: rgba(255, 248, 238, .17);
  --gold: #d2ac6b; --gold-ink: #e2c088; --gold-soft: rgba(210, 172, 107, .16); --accent: #f2ede6; --accent-ink: #171412;
  --ok: #7fc9a0; --ok-soft: rgba(127, 201, 160, .13); --warn: #e6b464; --warn-soft: rgba(230, 180, 100, .14); --bad: #f08c82; --bad-soft: rgba(240, 140, 130, .13);
  --rain: #8db7e6; --rain-soft: rgba(141, 183, 230, .13); --scrim: rgba(0, 0, 0, .5);
  --glass: rgba(36, 32, 28, .72); --glass-strong: rgba(29, 26, 23, .95); --rim-hi: rgba(255, 255, 255, .16); --rim: rgba(255, 255, 255, .07); --lens: rgba(255, 255, 255, .13);
  --btn: rgba(255, 248, 238, .08); --btn-line: rgba(255, 248, 238, .10); --key: rgba(255, 248, 238, .09); --key-on: rgba(255, 248, 238, .30);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 24px 60px -12px rgba(0, 0, 0, .7), 0 4px 14px rgba(0, 0, 0, .4);
  --card-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px rgba(255, 255, 255, .055), 0 1px 2px rgba(0, 0, 0, .35), 0 14px 30px -16px rgba(0, 0, 0, .7);
  --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .07), 0 12px 32px -10px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4);
  --hero-bg: radial-gradient(120% 110% at 0% 0%, rgba(210, 172, 107, .26), transparent 60%), linear-gradient(160deg, rgba(210, 172, 107, .12), rgba(210, 172, 107, .03));
  --hero-rim: inset 0 1px 0 rgba(236, 206, 150, .22), inset 0 0 0 1px rgba(236, 206, 150, .12), 0 20px 40px -20px rgba(0, 0, 0, .7);
  --primary-bg: linear-gradient(180deg, #fbf6ee, #e2d9cb); --primary-ink: #171412; --primary-shadow: inset 0 1px 0 #fff, 0 8px 20px -8px rgba(0, 0, 0, .7);

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "tnum" 1;
  min-height: 100vh;
}
/* The warm light the glass floats over: still, so it costs nothing to scroll past. */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(70vmax 55vmax at 8% -8%, var(--amb-1), transparent 62%), radial-gradient(55vmax 45vmax at 104% 14%, var(--amb-2), transparent 64%), radial-gradient(80vmax 60vmax at 64% 112%, var(--amb-3), transparent 60%); }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { width: 20px; height: 20px; flex: none; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 16px; }
.page { padding-top: 14px; padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
.stack > * + * { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrapx { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.item.stacked { flex-wrap: wrap; }
.item.stacked > .grow { flex-basis: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.center { text-align: center; }
.mt0 { margin-top: 0 !important; }

/* ---------- brand ---------- */
.brand { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; white-space: nowrap; flex: none; }
.brand .wm { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: 0.01em; }
.brand .ko { font-family: var(--ko); font-weight: 600; font-size: 13px; color: var(--gold); letter-spacing: 0.08em; }
.brand .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); display: inline-block; transform: translateY(-3px); }
/* The fox from the shop's logo, in the app's gold, over the wordmark where there is room. */
.crest { display: block; width: auto; height: 56px; aspect-ratio: 728 / 559; margin: 0 auto 14px; color: var(--gold); }

/* The top bar is clear at the top of a page; scrolled, it turns to glass over what passes under it. */
.topbar { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top); background: transparent; transition: background-color .3s ease, box-shadow .3s ease; }
.topbar.scrolled { background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: inset 0 -1px 0 var(--line), 0 10px 24px -18px rgba(60, 42, 20, .35); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; border-radius: 999px; transition: transform .45s var(--spring); }
.who:active { transform: scale(.95); transition-duration: .1s; }
.who .meta { text-align: right; line-height: 1.25; min-width: 0; max-width: 46vw; }
.who .meta b, .who .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .meta b { display: block; font-weight: 600; font-size: 14px; }
.who .meta span { font-size: 12px; color: var(--muted); }

.hello { margin: 6px 0 2px; font-size: 30px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.22; }
.hello small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 6px; letter-spacing: 0; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
h2.title { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
h3.h3 { font-size: 15px; font-weight: 600; margin: 20px 4px 8px; }

/* ---------- cards ---------- */
.card { position: relative; background: var(--card); border: 0; border-radius: var(--r-lg); box-shadow: var(--card-shadow); padding: 18px; color: inherit; }
button.card { transition: transform .45s var(--spring); }
button.card:active { transform: scale(.975); transition-duration: .12s; }
.card.pad-lg { padding: 22px; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-h .eyebrow { margin: 0; }
/* The card that matters most on a screen: dark smoked glass lit gold from one corner. */
.hero { background: var(--hero-bg); color: var(--hero-ink); box-shadow: var(--hero-rim); }
.hero .muted, .hero .eyebrow { color: var(--hero-muted); }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

.big { font-size: 46px; font-weight: 300; letter-spacing: -0.025em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; font-weight: 400; letter-spacing: 0; margin-left: 6px; color: var(--muted); }
.hero .big small { color: var(--hero-muted); }
.mid { font-size: 26px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--card); border: 0; box-shadow: var(--card-shadow); border-radius: var(--r-md); padding: 12px 8px 10px; text-align: center; }
.stat b { display: block; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--warn); }
.stat.bad b { color: var(--bad); }

.bar { height: 8px; border-radius: 99px; background: var(--inset); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #c9a061, var(--gold)); transform-origin: left; transition: width .5s ease; }
.hero .bar { background: rgba(255, 255, 255, 0.13); box-shadow: inset 0 1px 1px rgba(0, 0, 0, .25); }
.hero .bar > i { background: linear-gradient(90deg, #b8894a, #e9cc92); box-shadow: 0 0 14px rgba(233, 204, 146, .45); }

/* ---------- pills, chips ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--inset); color: var(--ink-2); white-space: nowrap; line-height: 1.5; }
.pill svg { width: 13px; height: 13px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.rain { background: var(--rain-soft); color: var(--rain); }
.pill.gold { background: var(--gold-soft); color: var(--gold-ink); }
.pill.ink { background: var(--ink); color: var(--bg); }
.pill.dash { background: transparent; box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
.hero .pill { background: rgba(255, 255, 255, .12); color: var(--hero-ink); }
.chips { position: relative; isolation: isolate; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; border: 0; background: var(--btn); box-shadow: inset 0 1px 0 var(--rim-hi), inset 0 0 0 1px var(--btn-line); border-radius: var(--r-md); padding: 10px 14px; text-align: left; min-width: 0; transition: transform .45s var(--spring), box-shadow .2s, background-color .2s; }
.chip:active { transform: scale(.96); transition-duration: .1s, .2s, .2s; }
.chip b { display: block; font-weight: 600; font-size: 15px; }
.chip > span { display: block; font-size: 12.5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--gold), 0 10px 22px -12px rgba(160, 122, 63, .75); }
.chip .tag { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--gold-ink); font-weight: 600; }
.chips.fill .chip { flex: 1 1 0; }
.qty-chips { margin-top: 10px; }
.qty-chips .chip { padding: 7px 12px; font-size: 14px; font-weight: 600; }

/* ---------- buttons ---------- */
/* Pressed, a button sinks a little at once; let go, it springs back. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--btn); color: var(--ink); box-shadow: inset 0 1px 0 var(--rim-hi), inset 0 0 0 1px var(--btn-line), var(--shadow-1); font-weight: 600; font-size: 15px; white-space: nowrap; text-decoration: none; transition: transform .45s var(--spring), opacity .2s, background-color .2s; }
.btn:active { transform: scale(.96); transition-duration: .1s, .2s, .2s; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--primary-bg); color: var(--primary-ink); box-shadow: var(--primary-shadow); }
.btn.gold { background: linear-gradient(180deg, #bb9152, #97703a); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 240, 210, .35), 0 8px 18px -8px rgba(151, 112, 58, .7); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.block { display: flex; width: 100%; }
.btn.xl { height: 60px; font-size: 17px; }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.loading { pointer-events: none; animation: btn-busy .2s ease .3s both; }
@keyframes btn-busy { to { opacity: .75; } }
.btn.loading::after { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sign-in .2s ease .3s both, spin .7s linear infinite; }
/* Behind an open sheet, which says what is going on, a busy button stays quiet. */
body.noscroll #app .btn.loading { animation: none; }
body.noscroll #app .btn.loading::after { display: none; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: var(--inset); color: var(--ink-2); transition: transform .45s var(--spring), background-color .2s; }
.icon-btn:hover { background: var(--line); }
.icon-btn:active { transform: scale(.9); transition-duration: .1s, .2s; }
.icon-btn svg { width: 20px; height: 20px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- avatars, lists ---------- */
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; background: var(--inset); color: var(--ink-2); flex: none; }
/* A person's monogram: their initial in the app's gold, set in a Thai display serif,
   on a deep tone of their own with a fine gold ring, like an enamel seal. The owner's
   seal carries the shield. */
.av.mono, .av.seal { position: relative; color: #dcbb7e; background: radial-gradient(120% 120% at 30% 18%, var(--av-hi), var(--av-lo) 72%); box-shadow: 0 1px 2px rgba(23, 18, 13, .22), inset 0 0 0 1px rgba(236, 211, 160, .4), inset 0 1px 1px rgba(255, 240, 210, .18); }
.av.mono::after, .av.seal::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid rgba(236, 211, 160, .22); pointer-events: none; }
.av.mono b { position: relative; top: -.1em; font: 400 1.2em/1 'Chonburi', 'Anuphan', serif; background: linear-gradient(180deg, #f7e9c9 0%, #dcbb7e 52%, #b3894a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.av.seal { --av-hi: #3a3129; --av-lo: #15120f; }
.av.t0 { --av-hi: #4d3829; --av-lo: #211813; }
.av.t1 { --av-hi: #2f5647; --av-lo: #13261f; }
.av.t2 { --av-hi: #6b2b30; --av-lo: #301216; }
.av.t3 { --av-hi: #2d405e; --av-lo: #121b2b; }
.av.t4 { --av-hi: #573550; --av-lo: #251523; }
.av.t5 { --av-hi: #555c37; --av-lo: #252916; }
.av.t6 { --av-hi: #444e59; --av-lo: #1c2227; }
.av.t7 { --av-hi: #704b2c; --av-lo: #332114; }
.av.t8 { --av-hi: #29565c; --av-lo: #10272a; }
.av.lg { width: 64px; height: 64px; font-size: 24px; margin: 0 auto; }
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); background: transparent; width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; transition: background-color .25s; }
.item:first-child { border-top: 0; }
button.item:hover { background: var(--surface-2); }
button.item:active { background: var(--inset); transition-duration: 0s; }
.item .t { font-weight: 500; }
.item .s { font-size: 13px; color: var(--muted); }
.item .r { text-align: right; flex: none; }
.item .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.item > svg { color: var(--ink-2); }
.av svg { width: 20px; height: 20px; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- tabs ---------- */
/* The tab bar floats: a capsule of glass over the page. What is chosen sits on
   a lens that glides to the next choice (see glideLenses). Scrolling down, the
   bar slims and tucks its labels away; scrolling up brings them back. (The
   glass itself is never moved or scaled: some phones stop blurring it then.) */
.tabbar { position: fixed; z-index: 30; left: 12px; right: 12px; bottom: max(10px, calc(env(safe-area-inset-bottom) - 12px)); max-width: 520px; margin: 0 auto; padding: 5px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); }
.tabbar .wrap { position: relative; isolation: isolate; display: flex; max-width: none; padding: 0; }
.tab { position: relative; z-index: 1; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; height: 54px; padding: 0 2px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-size: 11px; font-weight: 500; line-height: 1.3; transition: color .25s, height .45s var(--spring); }
.tab svg { width: 23px; height: 23px; transition: transform .45s var(--spring); }
.tab .lbl { transition: opacity .2s, margin .45s var(--spring); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--gold-ink); font-weight: 600; }
.tab[aria-selected="true"]::before, .tabbar .lens { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 999px; background: var(--lens); box-shadow: inset 0 1px 0 var(--rim-hi), 0 1px 3px rgba(60, 42, 20, .10), 0 6px 16px -8px rgba(60, 42, 20, .22); }
.tab:active svg { transform: scale(.84); transition-duration: .1s; }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 5px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; font-weight: 600; box-shadow: 0 0 0 2px var(--glass); }
.tabbar.min .tab { height: 44px; }
.tabbar.min .tab .lbl { opacity: 0; margin-top: -15px; }
.seg { position: relative; isolation: isolate; display: flex; background: var(--inset); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; border-radius: 11px; padding: 8px 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg button[aria-pressed="true"]::before, .seg > .lens { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 11px; background: var(--lens); box-shadow: inset 0 1px 0 var(--rim-hi), 0 1px 3px rgba(60, 42, 20, .12), 0 4px 12px -6px rgba(60, 42, 20, .2); }
/* The lens: drawn only while it glides from the old choice to the new one. */
.lens { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; will-change: transform; }
.gliding > [aria-selected="true"]::before, .gliding > [aria-pressed="true"]::before { opacity: 0; }
.chips > .lens { z-index: 2; border-radius: var(--r-md); box-shadow: inset 0 0 0 2px var(--gold), 0 10px 22px -12px rgba(160, 122, 63, .75); }
.chips.gliding > .chip[aria-pressed="true"] { background: var(--btn); box-shadow: inset 0 1px 0 var(--rim-hi), inset 0 0 0 1px var(--btn-line); }
.cal-grid > .lens { z-index: 2; border-radius: 11px; box-shadow: inset 0 0 0 2px var(--ink); }
.cal-grid.gliding > .cal-day[aria-pressed="true"] { box-shadow: none; }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav b { font-weight: 600; font-size: 16px; }
.monthnav .sub { font-size: 12.5px; color: var(--muted); display: block; font-weight: 400; }

/* ---------- start / pin ---------- */
.start { min-height: 100vh; display: flex; flex-direction: column; }
.start-head { padding: 38px 0 10px; text-align: center; }
.start-head .brand .wm { font-size: 34px; }
.start-head .brand .ko { font-size: 15px; }
.start-clock { font-size: 15px; color: var(--muted); margin-top: 6px; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.name-tile { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-lg); border: 0; background: var(--card); box-shadow: var(--card-shadow); text-align: left; color: inherit; transition: transform .45s var(--spring), background-color .2s; }
.name-tile:active { transform: scale(.955); transition-duration: .1s, .2s; }
.name-tile:hover { background: var(--surface-2); }
.name-tile .grow b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.name-tile .grow span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.group-h { margin: 22px 4px 10px; }
.foot-links { text-align: center; padding: 28px 0 40px; font-size: 13.5px; color: var(--muted); }

.pin-wrap { max-width: 380px; margin: 0 auto; padding: 22px 16px 40px; text-align: center; }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 22px 0 26px; min-height: 16px; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); transition: background-color .2s, box-shadow .2s; }
.pin-dots i.on { background: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.pin-dots i.new { animation: dot-pop .4s var(--spring); }
.pin-dots.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(3px); } }
@keyframes dot-pop { from { transform: scale(.3); } }
.pin-typed { font-size: 26px; letter-spacing: 0.3em; min-height: 40px; margin: 18px 0 12px; }
/* The keypad: round keys of glass, like a phone's own passcode screen. */
.keypad { display: grid; grid-template-columns: repeat(3, 76px); justify-content: center; gap: 16px 24px; margin: 0 auto; }
.key { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--key); box-shadow: inset 0 1px 0 var(--rim-hi), inset 0 0 0 1px var(--btn-line), 0 2px 8px -3px rgba(60, 42, 20, .16); font-size: 30px; font-weight: 300; color: var(--ink); display: grid; place-items: center; transition: transform .45s var(--spring), background-color .4s ease; }
.key:active { transform: scale(.9); background: var(--key-on); transition-duration: .08s, 0s; }
.key.tapped { animation: key-up .5s var(--spring); }
@keyframes key-up { from { transform: scale(.9); background-color: var(--key-on); } }
.key.fn { background: transparent; box-shadow: none; font-size: 15px; color: var(--ink-2); }
.key svg { width: 26px; height: 26px; }
.pin-err { color: var(--bad); font-size: 14px; min-height: 22px; }
.remember { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); margin-top: 18px; }

/* ---------- today / clock ---------- */
.now-clock { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 14px; }
.now-clock span { font-size: 50px; font-weight: 200; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.now-clock small { font-size: 13px; color: var(--muted); }
.live-clock { font-size: 46px; font-weight: 200; letter-spacing: -0.03em; line-height: 1.1; margin-top: 14px; font-variant-numeric: tabular-nums; }
.scan-ok { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; font-size: 14.5px; margin: 0 0 10px; }
.scan-ok svg { width: 18px; height: 18px; }
.gps-line { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.photo-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.photo-wall figure { margin: 0; }
.photo-wall img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; display: block; background: var(--surface-2); }
.photo-wall figcaption { font-size: 12.5px; margin-top: 6px; line-height: 1.35; }
.photo-wall figcaption b { display: block; font-weight: 600; font-size: 13.5px; }
.photo-wall figure.review img { outline: 3px solid var(--warn); outline-offset: -3px; }
.photo-wall.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.photo-wall .shots { display: grid; gap: 4px; }
.photo-wall .shots.two { grid-template-columns: 3fr 1fr; align-items: start; }
.photo-wall img.strip { aspect-ratio: auto; object-fit: contain; background: #000; }
.photo-wall .shots.two img.phone { aspect-ratio: 3 / 4; }
.photo-wall.wide .shots:not(.two) img.phone { width: 45%; }
.photo-wall .why, .review-why { color: var(--warn); font-size: 12.5px; margin-top: 4px; line-height: 1.4; }
.photo-wall figure .row { margin-top: 6px; gap: 6px; }
.scanner { position: relative; width: 100%; max-width: 420px; margin: 0 auto; aspect-ratio: 3 / 4; max-height: 58vh; border-radius: 22px; overflow: hidden; background: #111; box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .6); }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner .scan-box { position: absolute; left: 16%; right: 16%; top: 50%; aspect-ratio: 1; transform: translateY(-50%); border: 3px solid rgba(255, 255, 255, 0.92); border-radius: 22px; box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.28); animation: scan-breathe 2.4s ease-in-out infinite; }
@keyframes scan-breathe { 50% { transform: translateY(-50%) scale(.965); border-color: rgba(233, 204, 146, .95); } }
.poster-miss img { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 14px; background: var(--surface-2); display: block; }
.poster-miss ol { padding-left: 20px; margin: 10px 0; line-height: 1.7; }
.gps-line svg { width: 16px; height: 16px; }
.gps-line.ok { color: var(--ok); }
.gps-line.warn { color: var(--warn); }
.gps-line.wait { animation: sign-in .3s ease 1.5s both; }
.result .checks { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 12px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-size: 13px; font-weight: 500; }
.result .checks svg { width: 15px; height: 15px; }
.today-time { font-size: 58px; font-weight: 200; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.state-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hint { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r-md); padding: 11px 13px; }
.hint svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--gold); }
.hint.warn { background: var(--warn-soft); box-shadow: none; color: var(--warn); }
.hint.warn svg { color: var(--warn); }
.hint.bad { background: var(--bad-soft); box-shadow: none; color: var(--bad); }
.hint.bad svg { color: var(--bad); }
.rain-banner { display: flex; gap: 12px; align-items: center; background: var(--rain-soft); color: var(--rain); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 0 0 1px rgba(70, 120, 180, .12); }
.rain-banner > svg { width: 30px; height: 30px; flex: none; }
.rain-banner b { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }
.rain-banner span { display: block; font-size: 14px; margin-top: 2px; }
.kiosk .rain-banner { background: rgba(70, 120, 180, .16); color: #8db7e6; max-width: 680px; margin: 0 auto 18px; padding: 16px 20px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px rgba(141, 183, 230, .16); }
.kiosk .rain-banner b { font-size: 20px; }
.kiosk .rain-banner span { font-size: 16px; }
.rain-thanks { color: var(--rain); font-size: 14px; margin: 10px 0 0; }
.result, .result-wait { text-align: center; padding: 8px 0 4px; }
.result .mark, .result-wait .mark { position: relative; width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
.result .mark svg, .result-wait .mark svg { width: 40px; height: 40px; }
.result.warn .mark { background: var(--warn-soft); color: var(--warn); }
.result.bad .mark { background: var(--bad-soft); color: var(--bad); }
.result h2, .result-wait h2 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
.result p, .result-wait p { margin: 4px 0; color: var(--ink-2); }
.result p.first, .result-wait p.first { font-weight: 600; color: var(--ink); }
/* A clock-in on its way: its result's place at once, the mark breathing until the answer.
   The answer's mark springs in, its tick draws itself, and a ring of light spreads from it. */
.result-wait .mark { background: var(--gold-soft); color: var(--gold); animation: breathe 1.4s ease-in-out infinite; }
.result, .k-result { animation: sign-in .18s ease both; }
.result .mark, .k-result .mark { animation: pop .6s var(--spring) both; }
.result .mark svg path, .k-result .mark svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .45s var(--ease-out) .16s forwards; }
.result .mark::after, .k-result .mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: ring 1s var(--ease-out) .22s; pointer-events: none; }
@keyframes breathe { 50% { transform: scale(1.07); opacity: .7; } }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ring { from { opacity: .45; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }

/* ---------- feedback ---------- */
.fb-invite { display: flex; gap: 14px; align-items: flex-start; }
.fb-invite b { display: block; font-weight: 600; }
.fb-invite p { margin: 2px 0 12px; }
.fb-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--gold-soft); color: var(--gold); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
.fb-files { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.fb-file, .fb-add { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--inset); }
.fb-file img, .fb-file video { width: 100%; height: 100%; object-fit: cover; display: block; }
.fb-badge, .fb-thumb i { position: absolute; left: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; }
.fb-badge svg, .fb-thumb i svg { width: 11px; height: 11px; fill: currentColor; }
.fb-x { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; }
.fb-x svg { width: 14px; height: 14px; }
.fb-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px dashed var(--line-strong); background: transparent; color: var(--muted); font-size: 11.5px; text-align: center; line-height: 1.25; cursor: pointer; transition: transform .45s var(--spring); }
.fb-add:active { transform: scale(.95); transition-duration: .1s; }
.fb-add input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.fb-thumb { position: relative; width: 52px; height: 52px; border-radius: 14px; overflow: hidden; flex: none; background: var(--inset); color: var(--muted); display: grid; place-items: center; }
.fb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fb-thumb i { left: 4px; bottom: 4px; width: 18px; height: 18px; }
.fb-item { align-items: flex-start; }
.fb-item .pill { display: inline-flex; }
.fb-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.fb-note { margin-top: 6px; color: var(--ink-2); }
.fb-bar { margin: 16px auto 10px; max-width: 280px; }
.fb-body { white-space: pre-line; font-size: 16px; line-height: 1.6; margin: 14px 0 0; }
.fb-media { display: grid; gap: 10px; margin-top: 16px; }
.fb-media img, .fb-media video { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 18px; display: block; background: #0d0b0a; }
.fb-play { position: relative; width: 100%; aspect-ratio: 16 / 10; border: 0; border-radius: 18px; background: #1a1714 center / cover no-repeat; color: #fff; display: grid; place-items: center; overflow: hidden; }
.fb-play::before { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
.fb-play-in { position: relative; display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: rgba(255, 255, 255, .16); -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 0 0 1px rgba(255, 255, 255, .12); font-size: 15px; }
.fb-play-in svg { width: 18px; height: 18px; fill: currentColor; }
.fb-card .fb-ico { width: 36px; height: 36px; border-radius: 12px; }

/* ---------- day log ---------- */
.day { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day .d { text-align: center; line-height: 1.15; }
.day .d b { display: block; font-size: 20px; font-weight: 500; }
.day .d span { font-size: 12px; color: var(--muted); }
.day .d.we span { color: var(--gold); }
.day .m b { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.day .m .s { font-size: 13px; color: var(--muted); }
.day .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

/* ---------- board ---------- */
.board-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.board-row:first-child { border-top: 0; }
.board-row .t { font-weight: 600; }
.board-row .s { font-size: 12.5px; color: var(--muted); }
.board-row .st { margin-left: auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---------- team calendar ---------- */
.cal { padding: 16px 8px 14px; }
.cal .monthnav { padding: 0 2px 12px; }
.cal-grid { position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
.cal-dow.sun { color: var(--bad); }
.cal-day { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-width: 0; min-height: 62px; padding: 5px 2px 4px; border-radius: 11px; border: 0; background: var(--surface-2); text-align: left; color: inherit; transition: background-color .15s, transform .4s var(--spring); }
.cal-day:hover { background: var(--card); }
.cal-day:active { transform: scale(.93); transition-duration: .15s, .1s; }
.cal-day .n { align-self: flex-start; min-width: 20px; padding: 3px 5px; border-radius: 99px; font-size: 12.5px; font-weight: 600; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cal-day.sun .n { color: var(--bad); }
.cal-day.today .n { background: var(--ink); color: var(--bg); }
.cal-day[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); }
.cal-day.closed { background: repeating-linear-gradient(135deg, var(--inset) 0 5px, transparent 5px 10px), var(--surface-2); }
.cal-day .lbl { font-size: 10px; line-height: 1.2; color: var(--muted); padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-day .credit { position: absolute; top: 7px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.cal-ppl { display: flex; flex-wrap: wrap; gap: 2px; }
.pip { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-style: normal; font-weight: 600; line-height: 1; flex: none; }
.pip.leave { background: var(--gold); color: var(--surface); }
.pip.pending { border: 1.3px dashed var(--gold); color: var(--gold); }
.pip.more { width: auto; padding: 0 2px; color: var(--muted); }
.pip.hatch { border-radius: 5px; background: repeating-linear-gradient(135deg, var(--line-strong) 0 3px, transparent 3px 6px); }
.pip.dot { width: 8px; height: 8px; background: var(--gold); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend .pip { width: 14px; height: 14px; font-size: 0; }
.cal-legend .pip.dot { width: 8px; height: 8px; }
.cal-sel { border-top: 1px solid var(--line); }
.cal-sel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 4px; }
.cal-sel-h b { font-weight: 600; }
.cal-sel .item { padding-top: 10px; padding-bottom: 10px; }
.cal-sel .av { width: 34px; height: 34px; font-size: 13px; }

/* ---------- payroll ---------- */
.status-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--card-shadow); }
.status-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); flex: none; }
.status-bar.approved .dot { background: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); }
.status-bar.paid .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.status-bar b { display: block; font-weight: 600; }
.status-bar span { font-size: 13px; color: var(--muted); }
.emp-card { display: block; width: 100%; text-align: left; color: inherit; background: var(--card); border: 0; box-shadow: var(--card-shadow); border-radius: var(--r-lg); padding: 14px 16px; transition: transform .45s var(--spring); }
.emp-card:active { transform: scale(.975); transition-duration: .12s; }
.emp-card + .emp-card { margin-top: 10px; }
.emp-card .top { display: flex; align-items: center; gap: 12px; }
.emp-card .net { margin-left: auto; text-align: right; }
.emp-card .net b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.emp-card .net span { display: block; font-size: 12px; color: var(--muted); }
.emp-card .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lines { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.lines td { padding: 8px 0; vertical-align: top; border-top: 1px solid var(--line); }
.lines tr:first-child td { border-top: 0; }
.lines td.a { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; padding-left: 12px; }
.lines .d { display: block; font-size: 12.5px; color: var(--muted); }
.lines tr.total td { border-top: 1.5px solid var(--ink); font-weight: 600; }
.lines tr.neg td.a { color: var(--bad); }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r-md); }
table.log { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
table.log th, table.log td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.log th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface); position: sticky; top: 0; }
table.log tr:last-child td { border-bottom: 0; }
.warn-box { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-md); padding: 10px 12px; font-size: 13.5px; }
.warn-box div + div { margin-top: 4px; }

/* ---------- forms ---------- */
.field { display: block; margin-top: 14px; }
.field:first-child { margin-top: 0; }
.field > span { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; margin: 0 2px 6px; }
.field small { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
.input, select.input, textarea.input { width: 100%; min-width: 0; height: 48px; padding: 0 14px; border-radius: 14px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong), inset 0 1px 2px rgba(60, 42, 20, .05); font-size: 16px; appearance: none; -webkit-appearance: none; transition: box-shadow .2s; }
textarea.input { height: auto; min-height: 88px; padding: 12px 14px; resize: vertical; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 0 4px var(--gold-soft); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.two .field { margin-top: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--gold); }
.check small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 3px; }
.form-group { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
.form-group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* ---------- sheet (dialog) ---------- */
/* A sheet floats up on a spring as a pane of glass, clear of the screen's edges.
   Pulled down by its top, it follows the finger and goes when let go. */
#sheet-root .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; transition: opacity .35s ease; }
#sheet-root .sheet { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 61; max-width: 640px; margin: 0 auto; max-height: 92vh; max-height: calc(100dvh - 16px - env(safe-area-inset-top)); display: flex; flex-direction: column; background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-radius: 32px; box-shadow: inset 0 1px 0 var(--rim-hi), inset 0 0 0 1px var(--rim), var(--shadow-2); transform: translateY(calc(100% + 24px)); transition: transform .55s var(--spring-soft); }
#sheet-root .sheet.wide { max-width: 860px; }
#sheet-root.open .scrim { opacity: 1; }
#sheet-root.open .sheet { transform: none; }
#sheet-root.closing .scrim { transition-duration: .25s; }
.sheet.swap .sheet-h h2, .sheet.swap .sheet-b, .sheet.swap .sheet-f { animation: sign-in .22s ease both; }
#sheet-root.closing .sheet { transition: transform .28s cubic-bezier(.4, 0, .9, .5); }
.sheet .grab { flex: none; width: 38px; height: 5px; margin: 8px auto 0; border-radius: 3px; background: var(--line-strong); }
.sheet .grab, .sheet-h { touch-action: none; cursor: grab; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 12px 8px 22px; }
.sheet-h h2 { font-size: 18px; font-weight: 600; margin: 0; }
.sheet-b { padding: 4px 22px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-b > * { flex-shrink: 0; }
/* Buttons share the row evenly; one that would not fit whole goes to a row of its own. */
.sheet-f { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 18px calc(14px + max(0px, env(safe-area-inset-bottom) - 16px)); border-top: 1px solid var(--line); }
.sheet-f .btn { flex: 1 1 0; min-width: max-content; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 15.5px; color: inherit; border-radius: 0; transition: background-color .2s; }
.menu-item:first-child { border-top: 0; }
.menu-item:active { background: var(--inset); transition-duration: 0s; }
.menu-item svg { width: 20px; height: 20px; color: var(--ink-2); }
.menu-item.danger { color: var(--bad); }
.menu-item.danger svg { color: var(--bad); }

/* Messages float up over the tab bar as small panes of smoked glass. */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { max-width: 520px; background: rgba(30, 26, 22, .80); color: #f8f3eb; -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); padding: 12px 18px; border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 0 0 1px rgba(255, 255, 255, .06), 0 14px 34px -12px rgba(0, 0, 0, .5); font-size: 14.5px; pointer-events: auto; animation: toast-in .55s var(--spring) both; }
.toast.bad { background: rgba(158, 40, 33, .88); }
.toast.ok { background: rgba(36, 94, 66, .88); }
.toast.out { animation: toast-out .22s ease-in both; }
@keyframes toast-in { from { transform: translateY(20px) scale(.9); opacity: 0; } }
@keyframes toast-out { to { transform: translateY(10px) scale(.95); opacity: 0; } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.loading-screen { min-height: 70vh; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line-strong); border-top-color: var(--ink); animation: spin .8s linear infinite; }
/* Loading signs only for waits long enough to notice: a quick answer simply appears. */
.skel { background: linear-gradient(90deg, var(--inset) 20%, var(--surface-2) 50%, var(--inset) 80%); background-size: 200% 100%; animation: sign-in .3s ease .45s both, shimmer 1.4s ease-in-out infinite; border-radius: var(--r-lg); height: 120px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes sign-in { from { opacity: 0; } to { opacity: 1; } }
/* A note about something on its way shows only when it takes a while. */
.later { animation: sign-in .3s ease .6s both; }
.cam .cam-note, .live-qr.cam-off .live-cam-note, .live-qr.cam-starting .live-cam-note { animation: sign-in .3s ease 1s both; }
.loading-screen .spinner { animation: sign-in .3s ease .45s both, spin .8s linear infinite; }
/* A new screen rises in, its parts one just after another; a tab's content comes
   in from the side of the tab chosen. Data arriving in an outline fades in. */
#app.enter main > :not(.stack), #app.enter main > .stack > *, #app.enter .pin-wrap, #app.enter .start-head, #app.enter .start .names > * { animation: enter .5s var(--spring-soft) backwards; }
#app.enter main > .stack > :nth-child(2), #app.enter .start .names > :nth-child(2) { animation-delay: .03s; }
#app.enter main > .stack > :nth-child(3), #app.enter .start .names > :nth-child(3) { animation-delay: .06s; }
#app.enter main > .stack > :nth-child(4), #app.enter .start .names > :nth-child(4) { animation-delay: .09s; }
#app.enter main > .stack > :nth-child(n+5), #app.enter .start .names > :nth-child(n+5) { animation-delay: .12s; }
#app.enter.from-r main > :not(.stack), #app.enter.from-r main > .stack > * { animation-name: enter-r; }
#app.enter.from-l main > :not(.stack), #app.enter.from-l main > .stack > * { animation-name: enter-l; }
#app.enter .bar > i { animation: grow 1s var(--spring-soft) .15s backwards; }
#app.fill main .stack > :not(.hello) { animation: sign-in .25s ease both; }
#app.fill .names > * { animation: enter .45s var(--spring-soft) backwards; }
@keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes enter-r { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes enter-l { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } }
/* A screen's outline while its data is on the way: the same shapes, so nothing jumps when it arrives. */
.skel.tile { height: 68px; }
.skel.stat { height: 66px; border-radius: var(--r-md); border: 0; padding: 0; box-shadow: none; }
.outline .tab { opacity: .55; }
.stale { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 11px; border-radius: 999px; background: var(--inset); color: var(--muted); font-size: 12.5px; border: 0; }
.stale svg { width: 14px; height: 14px; }

/* ---------- kiosk (always dark, for the shop tablet) ---------- */
.kiosk { --k-bg: #0e0c0a; --k-surface: rgba(255, 248, 238, .055); --k-line: rgba(255, 248, 238, .09); --k-ink: #f4efe8; --k-muted: #9d9388; --k-rim: inset 0 1px 0 rgba(255, 255, 255, .09), inset 0 0 0 1px rgba(255, 255, 255, .06); min-height: 100vh; background: radial-gradient(1100px 620px at 50% -12%, rgba(210, 160, 90, .20) 0%, transparent 62%), radial-gradient(900px 520px at 100% 110%, rgba(60, 110, 104, .14), transparent 60%), var(--k-bg); color: var(--k-ink); display: flex; flex-direction: column; }
.kiosk .k-top { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 0; }
.kiosk .brand .wm { font-size: 26px; color: var(--k-ink); }
.kiosk .brand .ko { color: #d2ac6b; }
.kiosk .k-clock { text-align: center; padding: 26px 16px 8px; }
.kiosk .k-clock .t { font-size: clamp(64px, 14vw, 124px); font-weight: 200; letter-spacing: -0.045em; line-height: 1; font-variant-numeric: tabular-nums; }
.kiosk .k-clock .t small { font-size: 0.32em; color: var(--k-muted); letter-spacing: 0; margin-left: 6px; }
.kiosk .k-clock .d { color: var(--k-muted); margin-top: 10px; font-size: 17px; }
.kiosk .k-body { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 18px 24px 30px; }
.kiosk .k-prompt { text-align: center; color: var(--k-muted); margin: 10px 0 18px; font-size: 16px; letter-spacing: 0.02em; }
.kiosk .live-qr { display: flex; gap: 24px; align-items: center; justify-content: center; max-width: 720px; margin: 0 auto 22px; background: var(--k-surface); box-shadow: var(--k-rim), 0 30px 60px -30px rgba(0, 0, 0, .8); border-radius: var(--r-xl); padding: 18px 24px; }
.live-qr-box { width: 230px; height: 230px; flex: none; background: #fff; border-radius: 18px; padding: 8px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .5), 0 12px 30px -12px rgba(0, 0, 0, .7); }
.live-qr-box svg { display: block; width: 100%; height: 100%; }
.live-qr-text b { display: block; font-size: 22px; line-height: 1.35; color: var(--k-ink); }
.live-qr-text span { display: block; margin-top: 6px; color: var(--k-muted); font-size: 15px; }
.live-bar { height: 4px; margin-top: 16px; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
.live-bar i { display: block; height: 100%; background: linear-gradient(90deg, #b8894a, #e9cc92); transform-origin: left; }
@keyframes live-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@media (max-width: 640px) { .kiosk .live-qr { flex-direction: column; text-align: center; } .live-qr-box { width: 250px; height: 250px; } }
/* The screen's camera beside its QR: whoever scans sees themselves, and the picture is kept. */
.live-cam { position: relative; flex: none; width: 190px; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #000; box-shadow: inset 0 0 0 1px var(--k-line); }
.live-cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.live-cam-note { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 12px; line-height: 1.35; color: #f4efe8; background: linear-gradient(transparent, rgba(0, 0, 0, 0.72)); text-align: center; }
.live-qr.cam-covered .live-cam, .live-qr.cam-none .live-cam { outline: 3px solid #e0a458; outline-offset: -3px; }
.live-qr.cam-covered .live-cam-note, .live-qr.cam-none .live-cam-note { top: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.7); font-size: 14px; padding: 12px; }
.live-qr-off { width: 100%; height: 100%; display: grid; place-items: center; color: #a1968a; font-size: 18px; text-align: center; background: #f4efe8; border-radius: 10px; }
.cam-feed { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }
.k-update { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 680px; margin: 0 auto 16px; padding: 12px 16px; border-radius: 999px; background: rgba(210, 172, 107, .16); box-shadow: inset 0 1px 0 rgba(255, 236, 200, .16), inset 0 0 0 1px rgba(210, 172, 107, .2); color: #e9d9bd; text-decoration: none; font-weight: 600; }
.k-update svg { width: 18px; height: 18px; }
@media (max-width: 640px) { .live-cam { width: 170px; } }
.kiosk .names { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.kiosk .name-tile { background: var(--k-surface); box-shadow: var(--k-rim); color: var(--k-ink); padding: 18px; }
.kiosk .name-tile:hover { background: rgba(255, 248, 238, .08); }
.kiosk .name-tile .grow span { color: var(--k-muted); }
.kiosk .name-tile.done { opacity: 0.55; }
.kiosk .name-tile .ok { margin-left: auto; color: #7fc9a0; }
.kiosk .name-tile .ok svg { width: 22px; height: 22px; }
.kiosk .av { width: 46px; height: 46px; font-size: 17px; }
.kiosk .skel { background: linear-gradient(90deg, rgba(255, 248, 238, .04) 20%, rgba(255, 248, 238, .09) 50%, rgba(255, 248, 238, .04) 80%); background-size: 200% 100%; }
.skel.chip-skel { height: 64px; border-radius: var(--r-md); }
.k-wait { display: grid; gap: 18px; }
.kiosk .av:not(.mono):not(.seal) { background: #2a241e; color: #e9d9bd; }
.kiosk .group-h { color: var(--k-muted); }
.kiosk .keypad { grid-template-columns: repeat(3, 86px); gap: 18px 28px; }
.kiosk .key { width: 86px; height: 86px; background: rgba(255, 248, 238, .08); box-shadow: var(--k-rim); color: var(--k-ink); font-size: 34px; }
.kiosk .key:active { background: rgba(255, 248, 238, .3); }
.kiosk .key.tapped { animation-name: k-key-up; }
@keyframes k-key-up { from { transform: scale(.9); background-color: rgba(255, 248, 238, .3); } }
.kiosk .key.fn { background: transparent; box-shadow: none; color: var(--k-muted); }
.kiosk .pin-dots i { box-shadow: inset 0 0 0 1.5px #5a5047; }
.kiosk .pin-dots i.on { background: #f4efe8; box-shadow: inset 0 0 0 1.5px #f4efe8; }
.kiosk .btn { background: var(--k-surface); box-shadow: var(--k-rim); color: var(--k-ink); }
.kiosk .btn.primary { background: linear-gradient(180deg, #fffaf2, #e6ddcf); color: #171412; box-shadow: inset 0 1px 0 #fff, 0 10px 24px -10px rgba(0, 0, 0, .7); }
.kiosk .chip { background: var(--k-surface); box-shadow: var(--k-rim); color: var(--k-ink); }
.kiosk .chip > span { color: var(--k-muted); }
.kiosk .chip[aria-pressed="true"] { background: rgba(255, 248, 238, .09); box-shadow: inset 0 0 0 2px #e9cc92, 0 12px 26px -12px rgba(233, 204, 146, .45); }
.kiosk .chips > .lens { box-shadow: inset 0 0 0 2px #e9cc92, 0 12px 26px -12px rgba(233, 204, 146, .45); }
.kiosk .chips.gliding > .chip[aria-pressed="true"] { background: var(--k-surface); box-shadow: var(--k-rim); }
.kiosk .muted { color: var(--k-muted); }
.kiosk .hint { background: var(--k-surface); box-shadow: var(--k-rim); color: var(--k-muted); }
.k-panel { max-width: 720px; margin: 0 auto; }
.k-confirm { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.cam { position: relative; aspect-ratio: 4 / 3; border-radius: 24px; overflow: hidden; background: #000; box-shadow: inset 0 0 0 1px var(--k-line), 0 24px 50px -24px rgba(0, 0, 0, .8); }
.cam video, .cam img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
.cam .cam-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--k-muted); font-size: 14px; text-align: center; padding: 20px; }
.k-result, .k-result-wait { text-align: center; padding: 30px 0; }
.k-result .mark, .k-result-wait .mark { position: relative; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; background: rgba(127, 201, 160, 0.14); color: #7fc9a0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
.k-result .mark svg, .k-result-wait .mark svg { width: 58px; height: 58px; }
.k-result.warn .mark { background: rgba(230, 180, 100, 0.14); color: #e6b464; }
.k-result.bad .mark { background: rgba(240, 140, 130, 0.14); color: #f08c82; }
.k-result-wait .mark { background: rgba(210, 172, 107, 0.14); color: #d2ac6b; animation: breathe 1.4s ease-in-out infinite; }
.k-result h2, .k-result-wait h2 { font-size: 34px; font-weight: 400; margin: 0 0 10px; }
.k-result p, .k-result-wait p { color: var(--k-muted); font-size: 18px; margin: 6px 0; }
.k-result p.first, .k-result-wait p.first { color: var(--k-ink); font-weight: 500; }
.k-count { height: 3px; background: var(--k-line); border-radius: 3px; overflow: hidden; max-width: 320px; margin: 26px auto 0; }
.k-count i { display: block; height: 100%; background: linear-gradient(90deg, #b8894a, #e9cc92); animation: count linear forwards; }
@keyframes count { from { width: 100%; } to { width: 0; } }
.k-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 28px 20px; color: var(--k-muted); font-size: 13px; }
.k-foot button { background: none; border: 0; color: var(--k-muted); font-size: 13px; }

/* ---------- payslip document ---------- */
.slip-doc { background: #fff; color: #1c1917; border-radius: 6px; padding: 28px 26px; font-size: 13px; line-height: 1.5; border: 1px solid #e6e0d6; max-width: 560px; margin: 0 auto; }
.slip-doc .sd-head { display: flex; justify-content: space-between; gap: 18px; border-bottom: 1.5px solid #1c1917; padding-bottom: 14px; }
.slip-doc .sd-co b { font-size: 15px; font-weight: 600; display: block; margin-bottom: 2px; }
.slip-doc .sd-co span { display: block; color: #57534e; font-size: 11px; }
.slip-doc .sd-title { text-align: right; flex: none; }
.slip-doc .sd-title b { font-size: 18px; font-weight: 600; display: block; }
.slip-doc .sd-title span { display: block; color: #57534e; }
.slip-doc .sd-info { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 16px 0 18px; }
.slip-doc .sd-info dt { color: #78716c; }
.slip-doc .sd-info dd { margin: 0; }
.slip-doc .sd-info b { font-weight: 600; }
.slip-doc table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.slip-doc th { text-align: left; font-size: 11px; font-weight: 600; color: #78716c; padding: 0 0 6px; border-bottom: 1px solid #d6d3d1; }
.slip-doc td { padding: 6px 0; border-bottom: 1px solid #efebe7; vertical-align: top; }
.slip-doc td small { color: #78716c; margin-left: 8px; font-size: 12px; }
.slip-doc .a { text-align: right; white-space: nowrap; padding-left: 10px; }
.slip-doc tfoot td { border-bottom: 0; font-weight: 600; padding-top: 8px; }
.slip-doc .sd-net { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid #1c1917; padding-top: 12px; }
.slip-doc .sd-net span { font-weight: 600; font-size: 15px; }
.slip-doc .sd-net b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.slip-doc .sd-net small { font-size: 13px; font-weight: 500; }

/* ---------- QR poster ---------- */
.poster { background: #fff; color: #171412; border-radius: 8px; padding: 34px 28px; text-align: center; max-width: 420px; margin: 0 auto; border: 1px solid #e6e0d6; }
.poster .brand .wm { font-size: 30px; color: #171412; }
.poster .crest { height: 64px; margin-bottom: 12px; }
.poster .qr { width: 260px; height: 260px; margin: 20px auto 16px; }
.poster .qr svg { width: 100%; height: 100%; }
.poster h3 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.poster p { margin: 4px 0; color: #57504a; font-size: 14px; }
.poster .code { font-size: 12px; color: #8a8178; margin-top: 14px; letter-spacing: 0.1em; }

@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .big { font-size: 40px; }
  .slip-doc { padding: 20px 16px; }
  .slip-doc .sd-head { flex-direction: column; }
  .slip-doc .sd-title { text-align: left; }
  .slip-doc .sd-info { grid-template-columns: 96px 1fr; }
}
@media (max-width: 360px) {
  .keypad { grid-template-columns: repeat(3, 70px); gap: 14px 20px; }
  .key { width: 70px; height: 70px; }
}
@media (max-width: 760px) {
  .k-confirm { grid-template-columns: 1fr; }
  .kiosk .k-body { padding: 14px 16px 24px; }
  .kiosk .names { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (min-width: 900px) {
  :root { --wrap: 720px; }
}
/* Glass the phone cannot draw, or its owner asked to do without, is plain and solid. */
@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .tabbar, .topbar.scrolled, #sheet-root .sheet { background: var(--surface); }
  .toast { background: #1e1a16; }
}
@media (prefers-reduced-transparency: reduce) {
  .tabbar, .topbar.scrolled, #sheet-root .sheet, .card:not(.hero), .stat, .name-tile, .emp-card, .status-bar { background: var(--surface); }
  .tabbar, .topbar, #sheet-root .sheet, .toast { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .toast { background: #1e1a16; }
  body::before { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
@media print {
  body { background: #fff; }
  body::before { display: none; }
  body > *:not(#sheet-root) { display: none !important; }
  #sheet-root .scrim, .sheet-h, .sheet-f, .sheet .grab, .no-print { display: none !important; }
  #sheet-root .sheet { position: static; transform: none; opacity: 1; box-shadow: none; max-height: none; border-radius: 0; max-width: none; background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .sheet-b { overflow: visible; padding: 0; }
  .slip-doc, .poster { border: 0; }
  /* On paper the QR must read from a selfie a metre away: make it big. */
  .poster { max-width: none; padding: 0; }
  .poster .qr { width: 15cm; height: 15cm; margin: 0.5cm auto 0.4cm; }
  .poster .crest { height: 2.2cm; }
  .poster h3 { font-size: 26pt; }
  .poster p { font-size: 15pt; }
}
</style>
</head>

    var who = function (id) { return people[id] || empById(id) || { name: id }; };
    var sel = S.calSel && S.calSel.slice(0, 7) === c.month ? S.calSel : c.today.slice(0, 7) === c.month ? c.today : c.first;
    var day = c.days.filter(function (d) { return d.date === sel; })[0] || c.days[0];

  var calBy = {};

    return html`<div class="slip-doc" id="slip-doc">
